                  </button>
                  <button
                    onClick={() => handleConfirmChoice("Bottom", choiceModal.chooser)}
                    className="p-3.5 bg-slate-800 hover:bg-emerald-600 hover:text-white rounded-xl font-black text-sm uppercase tracking-wider transition border border-slate-700"
                  >
                    BOTTOM (Defense)
                  </button>
                  {!choiceModal.stage.toString().includes("TB") && choiceModal.stage !== "UTB" && (
                    <button
                      onClick={() => handleConfirmChoice("Neutral", choiceModal.chooser)}
                      className="p-3.5 bg-slate-800 hover:bg-emerald-600 hover:text-white rounded-xl font-black text-sm uppercase tracking-wider transition border border-slate-700"
                    >
                      NEUTRAL (Feet)
                    </button>
                  )}
                  {choiceModal.stage === 2 && !choiceModal.isAfterDefer && (
                    <button
                      onClick={() => handleConfirmChoice("Defer", choiceModal.chooser)}
                      className="p-3.5 bg-slate-800 hover:bg-amber-600 hover:text-black rounded-xl font-black text-sm uppercase tracking-wider transition border border-slate-700"
                    >
                      DEFER CHOICE ↷
                    </button>
                  )}
                </div>

                <button
                  onClick={() => setChoiceModal(null)}
                  className="text-xs text-slate-500 hover:text-slate-300 font-bold uppercase pt-2"
                >
                  Cancel / Close
                </button>
              </div>
            </div>
          )}

          {/* PENALTY & CAUTION SELECTION MODAL */}
          {penaltyTarget && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-amber-500/40 rounded-2xl max-w-sm w-full p-5 text-center shadow-2xl space-y-4">
                <div className="text-3xl mb-1">⚠️</div>
                <h3 className="text-lg font-black uppercase text-white tracking-wide">
                  Infraction on {penaltyTarget === "home" ? `Red (${awayWrestler})` : `Green (${homeWrestler})`}
                </h3>
                <p className="text-xs text-slate-400">
                  Select the penalty or caution infraction committed:
                </p>

                <div className="grid grid-cols-1 gap-2 text-left">
                  <button
                    onClick={() => handleCautionPenalty(penaltyTarget === "home" ? "away" : "home")}
                    className="p-3 bg-slate-800 hover:bg-amber-600 hover:text-black rounded-xl font-bold text-xs flex justify-between items-center transition border border-slate-700"
                  >
                    <div>
                      <div className="font-bold">False Start / Caution</div>
                      <div className="text-[10px] opacity-75 font-normal">
                        Count: {(penaltyTarget === "home" ? awayCautions : homeCautions) + 1} • {((penaltyTarget === "home" ? awayCautions : homeCautions) + 1) <= 2 ? "Warning (0 pts)" : "+1 Penalty Point"}
                      </div>
                    </div>
                    <span className="font-mono font-black">
                      {((penaltyTarget === "home" ? awayCautions : homeCautions) + 1) <= 2 ? "0 PTS" : "+1 PT"}
                    </span>
                  </button>

                  <button
                    onClick={() => awardStandardPenalty(penaltyTarget, "Locked Hands / Clasping")}
                    className="p-3 bg-slate-800 hover:bg-amber-600 hover:text-black rounded-xl font-bold text-xs flex justify-between items-center transition"
                  >
                    <span>Locked Hands / Clasping</span>
                    <span className="font-mono font-black">+1 PT</span>
                  </button>
                  <button
                    onClick={() => awardStandardPenalty(penaltyTarget, "Unnecessary Roughness")}
                    className="p-3 bg-slate-800 hover:bg-amber-600 hover:text-black rounded-xl font-bold text-xs flex justify-between items-center transition"
                  >
                    <span>Unnecessary Roughness</span>
                    <span className="font-mono font-black">+1 PT</span>
                  </button>
                  <button
                    onClick={() => awardStandardPenalty(penaltyTarget, "Illegal Hold or Maneuver")}
                    className="p-3 bg-slate-800 hover:bg-amber-600 hover:text-black rounded-xl font-bold text-xs flex justify-between items-center transition"
                  >
                    <span>Illegal Hold or Maneuver</span>
                    <span className="font-mono font-black">+1 PT</span>
                  </button>
                </div>

                <button
                  onClick={() => setPenaltyTarget(null)}
                  className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold text-xs uppercase"
                >
                  Cancel
                </button>
              </div>
            </div>
          )}

          {/* Finished Match Dialog */}
          {isFinished && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
                <div className="text-3xl mb-1">🏆</div>
                <h3 className="text-xl font-black uppercase tracking-wider text-white">
                  Match Concluded
                </h3>
                <div className="text-sm font-semibold text-amber-400 mt-1">
                  Result: {finishType}
                </div>

                <div className="flex items-center justify-around my-5 py-3 bg-slate-800 rounded-xl">
                  <div>
                    <div className="text-xs font-bold text-emerald-400">{homeWrestler}</div>
                    <div className="text-3xl font-mono font-black">{homeScore}</div>
                  </div>
                  <div className="text-slate-500 font-bold">vs</div>
                  <div>
                    <div className="text-xs font-bold text-rose-400">{awayWrestler}</div>
                    <div className="text-3xl font-mono font-black">{awayScore}</div>
                  </div>
                </div>

                <div className="text-xs text-slate-400 mb-5">
                  {eventType === "dual" && (
                    <span>
                      Dual Team Points to award:{" "}
                      <strong className="text-blue-400 font-bold text-sm">
                        {homeScore >= awayScore
                          ? finishType === "Fall" ? 6 : finishType === "Tech Fall" ? 5 : finishType === "Major Decision" ? 4 : 3
                          : 0} pts
                      </strong>
                    </span>
                  )}
                  {eventType === "tournament" && (
                    <span>
                      Tournament Advancement + Bonus:{" "}
                      <strong className="text-purple-400 font-bold text-sm">
                        {homeScore >= awayScore
                          ? finishType === "Fall" ? 4 : finishType === "Tech Fall" ? 3.5 : finishType === "Major Decision" ? 3 : 2
                          : 0} pts
                      </strong>
                    </span>
                  )}
                  {eventType === "wrestleoff" && (
                    <span className="text-amber-300 font-semibold">
                      Recorded to both wrestlers' season stat totals.
                    </span>
                  )}
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={resetMatch}
                    className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-xs uppercase"
                  >
                    Discard
                  </button>
                  <button
                    onClick={commitResult}
                    className="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black rounded-xl font-black text-xs uppercase tracking-wider"
                  >
                    Save & Submit
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // COMPONENT: MATCHES TABLE VIEW
    // =========================================================================
    function MatchesTableView({ title, subtitle, matches, onEditMatch, onViewTimeline, type, teamName }) {
      const totalTeamPts = matches.reduce((sum, m) => sum + (type === "dual" ? (m.dualPointsAwarded || 0) : (m.tourneyPointsAwarded || 0)), 0);
      const totalWins = matches.filter(m => m.winner === "home").length;

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-2xl font-black text-white uppercase tracking-tight">
                {title}
              </h2>
              <p className="text-xs text-slate-400 mt-0.5">{subtitle}</p>
            </div>
            {type !== "wrestleoff" && (
              <div className="flex gap-3">
                <div className="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-center">
                  <div className="text-[10px] text-slate-400 uppercase font-bold">Record</div>
                  <div className="text-xl font-mono font-black text-blue-400">
                    {totalWins}W - {matches.length - totalWins}L
                  </div>
                </div>
                <div className="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-center">
                  <div className="text-[10px] text-slate-400 uppercase font-bold">Team Points</div>
                  <div className="text-xl font-mono font-black text-amber-400">
                    {totalTeamPts}
                  </div>
                </div>
              </div>
            )}
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-800/70 uppercase text-slate-400 font-bold border-b border-slate-700">
                  <tr>
                    <th className="p-3">Date</th>
                    <th className="p-3">Event</th>
                    <th className="p-3">Weight</th>
                    <th className="p-3">{type === "wrestleoff" ? "Wrestler 1" : teamName}</th>
                    <th className="p-3">{type === "wrestleoff" ? "Wrestler 2" : "Opponent"}</th>
                    <th className="p-3 text-center">Final Score</th>
                    <th className="p-3">Result</th>
                    {type !== "wrestleoff" && <th className="p-3 text-center">Team Pts</th>}
                    <th className="p-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800 font-medium">
                  {matches.length === 0 ? (
                    <tr>
                      <td colSpan="9" className="p-6 text-center text-slate-500 italic">
                        No matches recorded yet for this category.
                      </td>
                    </tr>
                  ) : (
                    matches.map(m => (
                      <tr key={m.id} className="hover:bg-slate-800/40 transition">
                        <td className="p-3 font-mono text-slate-400">{m.date}</td>
                        <td className="p-3 font-bold text-white">{m.eventName}</td>
                        <td className="p-3 font-bold text-slate-300">{m.weightClass} lbs</td>
                        <td className="p-3 font-semibold text-emerald-400">{m.homeWrestler}</td>
                        <td className="p-3 font-semibold text-rose-400">{m.opponentName}</td>
                        <td className="p-3 text-center font-mono font-bold">
                          {m.homeScore} - {m.awayScore}
                        </td>
                        <td className="p-3">
                          <span
                            className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                              m.winner === "home"
                                ? "bg-emerald-950 text-emerald-300 border border-emerald-800"
                                : "bg-rose-950 text-rose-300 border border-rose-800"
                            }`}
                          >
                            {m.winType}
                          </span>
                        </td>
                        {type !== "wrestleoff" && (
                          <td className="p-3 text-center font-mono font-black text-amber-400">
                            +{type === "dual" ? m.dualPointsAwarded : m.tourneyPointsAwarded}
                          </td>
                        )}
                        <td className="p-3 text-right space-x-2 whitespace-nowrap">
                          <button
                            onClick={() => onViewTimeline(m)}
                            className="px-2.5 py-1 bg-amber-500/20 hover:bg-amber-500 hover:text-black border border-amber-500/40 text-amber-300 rounded text-[11px] font-bold transition"
                          >
                            Timeline ⏱
                          </button>
                          <button
                            onClick={() => onEditMatch(m)}
                            className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white rounded text-[11px] font-bold transition"
                          >
                            Edit
                          </button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: SCORING TIMELINE / BREAKDOWN
    // =========================================================================
    function ScoringTimelineModal({ match, onClose }) {
      const history = match.history || [];

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4 shrink-0">
              <div>
                <h3 className="text-lg font-black uppercase text-white tracking-wide">
                  Match Scoring Breakdown
                </h3>
                <span className="text-xs text-slate-400">
                  {match.homeWrestler} ({match.homeScore}) vs {match.opponentName} ({match.awayScore}) • {match.winType}
                </span>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-xl font-bold">
                ✕
              </button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2 pr-1">
              {history.length === 0 ? (
                <div className="p-8 text-center text-slate-500 italic text-sm">
                  No chronological point log found for this match (action totals were entered directly).
                </div>
              ) : (
                history.map((event, idx) => {
                  const isPenalty = event.code === "PEN";
                  const isCaution = event.code === "CAUTION";
                  const isSys = event.side === "SYS";
                  return (
                    <div
                      key={event.id || idx}
                      className={`flex items-center justify-between p-2.5 rounded-xl border ${
                        isSys
                          ? "bg-slate-800/60 border-amber-600/50 text-amber-200"
                          : isPenalty || isCaution
                          ? "bg-amber-950/30 border-amber-700/60 text-amber-200"
                          : event.side === "home"
                          ? "bg-emerald-950/40 border-emerald-800/60 text-emerald-300"
                          : "bg-rose-950/40 border-rose-800/60 text-rose-300"
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <span className="w-6 h-6 rounded-full flex items-center justify-center font-black text-xs bg-slate-900 border border-slate-700 text-slate-300">
                          {idx + 1}
                        </span>
                        <div>
                          <div className="font-extrabold text-sm text-white flex items-center gap-1.5">
                            <span>
                              {isSys
                                ? "System Event"
                                : event.side === "home"
                                ? match.homeWrestler
                                : match.opponentName}
                            </span>
                            {isCaution && (
                              <span className="text-amber-400 text-[10px] uppercase px-1 bg-amber-950 border border-amber-700 rounded">
                                Caution
                              </span>
                            )}
                            {isPenalty && (
                              <span className="text-rose-400 text-[10px] uppercase px-1 bg-rose-950 border border-rose-700 rounded">
                                Penalty Point
                              </span>
                            )}
                          </div>
                          <div className="text-xs opacity-90 font-medium">
                            {event.description || event.code} {event.points > 0 ? `(+${event.points} pts)` : ""}
                          </div>
                        </div>
                      </div>

                      <div className="text-right font-mono text-xs">
                        <span className="bg-slate-900/80 px-2 py-1 rounded text-slate-300 font-bold">
                          {event.period} • {event.timeFormatted || `${event.seconds}s`}
                        </span>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400 shrink-0">
              <span>Takedowns: <strong className="text-white">{match.takedowns || 0}</strong></span>
              <span>Cautions: <strong className="text-amber-400">{match.homeCautions || 0}</strong></span>
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: EDIT MATCH
    // =========================================================================
    function EditMatchModal({ match, roster, onSave, onDelete, onClose }) {
      const [formData, setFormData] = useState({ ...match });

      const handleScoreChange = (home, away) => {
        const h = parseInt(home) || 0;
        const a = parseInt(away) || 0;
        const winner = h > a ? "home" : a > h ? "away" : "tie";
        setFormData({ ...formData, homeScore: h, awayScore: a, winner });
      };

      const handleSave = (e) => {
        e.preventDefault();
        const isHomeWinner = formData.winner === "home";
        let dualPts = 0;
        if (formData.eventType === "dual" && isHomeWinner) {
          if (formData.winType === "Fall" || formData.winType === "Forfeit") dualPts = 6;
          else if (formData.winType === "Tech Fall") dualPts = 5;
          else if (formData.winType === "Major Decision") dualPts = 4;
          else dualPts = 3;
        }

        let tourneyPts = 0;
        if (formData.eventType === "tournament" && isHomeWinner) {
          tourneyPts = 2;
          if (formData.winType === "Fall") tourneyPts += 2;
          else if (formData.winType === "Tech Fall") tourneyPts += 1.5;
          else if (formData.winType === "Major Decision") tourneyPts += 1;
        }

        onSave({
          ...formData,
          dualPointsAwarded: dualPts,
          tourneyPointsAwarded: tourneyPts,
          takedowns: parseInt(formData.takedowns) || 0,
          escapes: parseInt(formData.escapes) || 0,
          reversals: parseInt(formData.reversals) || 0,
          nearfalls: parseInt(formData.nearfalls) || 0
        });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
              <h3 className="text-lg font-black uppercase text-white tracking-wide">
                Adjust Match Statistics
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-xl font-bold">
                ✕
              </button>
            </div>

            <form onSubmit={handleSave} className="space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 font-bold uppercase block mb-1">Event Type</label>
                  <select
                    value={formData.eventType}
                    onChange={(e) => setFormData({ ...formData, eventType: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold focus:outline-none"
                  >
                    <option value="dual">Dual Meet</option>
                    <option value="tournament">Tournament</option>
                    <option value="wrestleoff">Wrestle-Off</option>
                  </select>
                </div>
                <div>
                  <label className="text-slate-400 font-bold uppercase block mb-1">Event Name</label>
                  <input
                    type="text"
                    value={formData.eventName}
                    onChange={(e) => setFormData({ ...formData, eventName: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold focus:outline-none"
                  />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div className="col-span-2">
                  <label className="text-slate-400 font-bold uppercase block mb-1">Wrestler 1 (Home)</label>
                  <select
                    value={formData.homeWrestler}
                    onChange={(e) => setFormData({ ...formData, homeWrestler: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold focus:outline-none text-emerald-400"
                  >
                    {roster.map(w => (
                      <option key={w.id} value={w.name}>{w.name} ({w.weight} lbs)</option>
                    ))}
                    <option value={formData.homeWrestler}>{formData.homeWrestler}</option>
                  </select>
                </div>
                <div>
                  <label className="text-slate-400 font-bold uppercase block mb-1">Weight</label>
                  <input
                    type="text"
                    value={formData.weightClass}
                    onChange={(e) => setFormData({ ...formData, weightClass: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold text-center focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="text-slate-400 font-bold uppercase block mb-1">Wrestler 2 / Opponent</label>
                {formData.eventType === "wrestleoff" ? (
                  <select
                    value={formData.opponentName}
                    onChange={(e) => setFormData({ ...formData, opponentName: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold focus:outline-none text-rose-400"
                  >
                    {roster.map(w => (
                      <option key={w.id} value={w.name}>{w.name} ({w.weight} lbs)</option>
                    ))}
                    <option value={formData.opponentName}>{formData.opponentName}</option>
                  </select>
                ) : (
                  <input
                    type="text"
                    value={formData.opponentName}
                    onChange={(e) => setFormData({ ...formData, opponentName: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold focus:outline-none text-rose-400"
                  />
                )}
              </div>

              <div className="grid grid-cols-3 gap-3 bg-slate-800/60 p-3 rounded-xl border border-slate-800">
                <div>
                  <label className="text-emerald-400 font-bold uppercase block mb-1 text-[11px]">Home Score</label>
                  <input
                    type="number"
                    value={formData.homeScore}
                    onChange={(e) => handleScoreChange(e.target.value, formData.awayScore)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 font-mono font-black text-center text-lg"
                  />
                </div>
                <div>
                  <label className="text-rose-400 font-bold uppercase block mb-1 text-[11px]">Opp Score</label>
                  <input
                    type="number"
                    value={formData.awayScore}
                    onChange={(e) => handleScoreChange(formData.homeScore, e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 font-mono font-black text-center text-lg"
                  />
                </div>
                <div>
                  <label className="text-slate-400 font-bold uppercase block mb-1 text-[11px]">Win Type</label>
                  <select
                    value={formData.winType}
                    onChange={(e) => setFormData({ ...formData, winType: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 font-bold"
                  >
                    <option value="Fall">Fall (Pin)</option>
                    <option value="Tech Fall">Tech Fall</option>
                    <option value="Major Decision">Major Decision</option>
                    <option value="Decision">Decision</option>
                    <option value="Decision (OT)">Decision (OT)</option>
                    <option value="Forfeit">Forfeit</option>
                  </select>
                </div>
              </div>

              <div className="bg-slate-800/40 p-3 rounded-xl border border-slate-800">
                <span className="font-bold text-slate-400 uppercase text-[10px] block mb-2">
                  Adjust Recorded Action Tallies:
                </span>
                <div className="grid grid-cols-4 gap-2 text-center">
                  <div>
                    <label className="text-slate-400 font-bold block mb-1">TD (+3)</label>
                    <input
                      type="number"
                      value={formData.takedowns}
                      onChange={(e) => setFormData({ ...formData, takedowns: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 font-bold font-mono text-center"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 font-bold block mb-1">Escape</label>
                    <input
                      type="number"
                      value={formData.escapes}
                      onChange={(e) => setFormData({ ...formData, escapes: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 font-bold font-mono text-center"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 font-bold block mb-1">Reversal</label>
                    <input
                      type="number"
                      value={formData.reversals}
                      onChange={(e) => setFormData({ ...formData, reversals: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 font-bold font-mono text-center"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 font-bold block mb-1">Near Falls</label>
                    <input
                      type="number"
                      value={formData.nearfalls}
                      onChange={(e) => setFormData({ ...formData, nearfalls: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 font-bold font-mono text-center"
                    />
                  </div>
                </div>
              </div>

              <div className="flex items-center justify-between pt-2">
                <button
                  type="button"
                  onClick={() => onDelete(formData.id)}
                  className="px-3 py-2 bg-rose-950 border border-rose-800 hover:bg-rose-900 text-rose-300 rounded-xl font-bold transition"
                >
                  Delete Match
                </button>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-slate-300"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-black rounded-xl font-black uppercase tracking-wider"
                  >
                    Save Changes
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: EDIT WRESTLER INFO
    // =========================================================================
    function EditWrestlerModal({ wrestler, onSave, onClose }) {
      const [name, setName] = useState(wrestler.name);
      const [weight, setWeight] = useState(wrestler.weight);
      const [grade, setGrade] = useState(wrestler.grade || "Fr");

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim() || !weight.trim()) return;
        onSave({ ...wrestler, name: name.trim(), weight: weight.trim(), grade }, wrestler.name);
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 sm:p-6 shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
              <h3 className="text-base font-black uppercase text-white tracking-wide">
                Edit Wrestler Information
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-xl font-bold">
                ✕
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="text-slate-400 font-bold uppercase block mb-1">Full Name</label>
                <input
                  type="text"
                  required
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 font-bold text-white focus:outline-none focus:border-amber-400"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 font-bold uppercase block mb-1">Weight (lbs)</label>
                  <input
                    type="text"
                    required
                    value={weight}
                    onChange={(e) => setWeight(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 font-bold text-white text-center focus:outline-none focus:border-amber-400"
                  />
                </div>
                <div>
                  <label className="text-slate-400 font-bold uppercase block mb-1">Grade</label>
                  <select
                    value={grade}
                    onChange={(e) => setGrade(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 font-bold text-white focus:outline-none"
                  >
                    <option value="Fr">Freshman (Fr)</option>
                    <option value="So">Sophomore (So)</option>
                    <option value="Jr">Junior (Jr)</option>
                    <option value="Sr">Senior (Sr)</option>
                  </select>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-slate-300"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-black rounded-xl font-black uppercase tracking-wider"
                >
                  Update Wrestler
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENT: ROSTER VIEW (WITH CUSTOM TEAM NAME)
    // =========================================================================
    function RosterView({ roster, setRoster, matches, onRemoveWrestler, onEditWrestler, teamName, setTeamName }) {
      const [newName, setNewName] = useState("");
      const [newWeight, setNewWeight] = useState("");
      const [newGrade, setNewGrade] = useState("Fr");
      const [isEditingTeamName, setIsEditingTeamName] = useState(false);
      const [tempTeamName, setTempTeamName] = useState(teamName);

      const addWrestler = (e) => {
        e.preventDefault();
        if (!newName || !newWeight) return;
        const entry = {
          id: "w_" + Date.now(),
          name: newName,
          weight: newWeight,
          grade: newGrade
        };
        setRoster([...roster, entry]);
        setNewName("");
        setNewWeight("");
      };

      const handleSaveTeamName = (e) => {
        e.preventDefault();
        setTeamName(tempTeamName.trim() || "Our Wrestling Team");
        setIsEditingTeamName(false);
      };

      const computeStats = (wrestlerName) => {
        let wins = 0;
        let losses = 0;
        let falls = 0;
        let td = 0;
        let e = 0;
        let rev = 0;
        let nf = 0;
        let dualWins = 0;
        let dualMatches = 0;
        let tourneyWins = 0;
        let tourneyMatches = 0;
        let wrestleoffWins = 0;
        let wrestleoffMatches = 0;

        matches.forEach(m => {
          if (m.homeWrestler === wrestlerName) {
            if (m.winner === "home") wins++;
            else losses++;
            if (m.winner === "home" && m.winType === "Fall") falls++;
            td += m.takedowns || 0;
            e += m.escapes || 0;
            rev += m.reversals || 0;
            nf += m.nearfalls || 0;

            if (m.eventType === "dual") {
              dualMatches++;
              if (m.winner === "home") dualWins++;
            } else if (m.eventType === "tournament") {
              tourneyMatches++;
              if (m.winner === "home") tourneyWins++;
            } else if (m.eventType === "wrestleoff") {
              wrestleoffMatches++;
              if (m.winner === "home") wrestleoffWins++;
            }
          } else if (m.eventType === "wrestleoff" && m.opponentName === wrestlerName) {
            if (m.winner === "away") wins++;
            else losses++;
            if (m.winner === "away" && m.winType === "Fall") falls++;
            td += m.awayTakedowns || 0;
            e += m.awayEscapes || 0;
            rev += m.awayReversals || 0;
            nf += m.awayNearfalls || 0;
            wrestleoffMatches++;
            if (m.winner === "away") wrestleoffWins++;
          }
        });

        return {
          total: wins + losses,
          record: `${wins}-${losses}`,
          dualRecord: `${dualWins}-${dualMatches - dualWins}`,
          tourneyRecord: `${tourneyWins}-${tourneyMatches - tourneyWins}`,
          wrestleoffRecord: `${wrestleoffWins}-${wrestleoffMatches - wrestleoffWins}`,
          falls,
          td,
          e,
          rev,
          nf
        };
      };

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                {isEditingTeamName ? (
                  <form onSubmit={handleSaveTeamName} className="flex items-center gap-2">
                    <input
                      type="text"
                      value={tempTeamName}
                      onChange={(e) => setTempTeamName(e.target.value)}
                      placeholder="Team Name"
                      className="bg-slate-800 border border-amber-400 rounded-lg px-2.5 py-1 text-lg font-black text-white focus:outline-none"
                    />
                    <button type="submit" className="px-3 py-1 bg-amber-500 hover:bg-amber-400 text-black font-black text-xs rounded-lg uppercase">
                      Save
                    </button>
                    <button type="button" onClick={() => setIsEditingTeamName(false)} className="px-2 py-1 text-xs text-slate-400">
                      Cancel
                    </button>
                  </form>
                ) : (
                  <div className="flex items-center gap-2">
                    <h2 className="text-2xl font-black text-white uppercase tracking-tight">
                      {teamName}
                    </h2>
                    <button
                      onClick={() => { setTempTeamName(teamName); setIsEditingTeamName(true); }}
                      title="Edit Team Name"
                      className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-bold"
                    >
                      ✎ Edit Name
                    </button>
                  </div>
                )}
              </div>
              <p className="text-xs text-slate-400 mt-0.5">
                Official squad roster, team weights, and season record breakdowns
              </p>
            </div>

            <form onSubmit={addWrestler} className="flex flex-wrap items-center gap-2 bg-slate-900 border border-slate-800 p-2 rounded-xl">
              <input
                type="text"
                placeholder="Wrestler Name"
                value={newName}
                onChange={e => setNewName(e.target.value)}
                className="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold focus:outline-none text-white"
              />
              <input
                type="text"
                placeholder="Wt (lbs)"
                value={newWeight}
                onChange={e => setNewWeight(e.target.value)}
                className="w-16 bg-slate-800 border border-slate-700 px-2 py-1.5 rounded-lg text-xs text-center font-bold focus:outline-none text-white"
              />
              <select
                value={newGrade}
                onChange={e => setNewGrade(e.target.value)}
                className="bg-slate-800 border border-slate-700 px-2 py-1.5 rounded-lg text-xs font-bold focus:outline-none"
              >
                <option value="Fr">Fr</option>
                <option value="So">So</option>
                <option value="Jr">Jr</option>
                <option value="Sr">Sr</option>
              </select>
              <button
                type="submit"
                className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-black uppercase text-white"
              >
                + Add
              </button>
            </form>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-800/70 uppercase text-slate-400 font-bold border-b border-slate-700">
                  <tr>
                    <th className="p-3">Wrestler</th>
                    <th className="p-3">Weight</th>
                    <th className="p-3">Overall</th>
                    <th className="p-3 text-blue-400">Dual Record</th>
                    <th className="p-3 text-purple-400">Tourney Record</th>
                    <th className="p-3 text-amber-400">Wrestle-Off</th>
                    <th className="p-3 text-center">Pins</th>
                    <th className="p-3 text-center">TDs</th>
                    <th className="p-3 text-center">Escapes</th>
                    <th className="p-3 text-center">Reversals</th>
                    <th className="p-3 text-center">Near Falls</th>
                    <th className="p-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800 font-medium">
                  {roster.length === 0 ? (
                    <tr>
                      <td colSpan="12" className="p-6 text-center text-slate-500 italic">
                        No wrestlers on this team roster yet. Add one above!
                      </td>
                    </tr>
                  ) : (
                    roster.map(w => {
                      const st = computeStats(w.name);
                      return (
                        <tr key={w.id} className="hover:bg-slate-800/40 transition">
                          <td className="p-3 font-bold text-white">
                            {w.name}{" "}
                            <span className="text-[10px] text-slate-500 uppercase ml-1">({w.grade})</span>
                          </td>
                          <td className="p-3 font-mono text-slate-300">{w.weight} lbs</td>
                          <td className="p-3 font-mono font-bold text-amber-400">{st.record}</td>
                          <td className="p-3 font-mono text-blue-400">{st.dualRecord}</td>
                          <td className="p-3 font-mono text-purple-400">{st.tourneyRecord}</td>
                          <td className="p-3 font-mono text-amber-300 font-semibold">{st.wrestleoffRecord}</td>
                          <td className="p-3 text-center font-mono font-bold text-rose-400">{st.falls}</td>
                          <td className="p-3 text-center font-mono">{st.td}</td>
                          <td className="p-3 text-center font-mono">{st.e}</td>
                          <td className="p-3 text-center font-mono">{st.rev}</td>
                          <td className="p-3 text-center font-mono">{st.nf}</td>
                          <td className="p-3 text-right space-x-1.5 whitespace-nowrap">
                            <button
                              onClick={() => onEditWrestler(w)}
                              className="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded font-bold text-[11px]"
                            >
                              Edit
                            </button>
                            <button
                              onClick={() => onRemoveWrestler(w.id, w.name)}
                              title={`Remove ${w.name}`}
                              className="px-2 py-1 bg-slate-800 hover:bg-rose-900 border border-slate-700 hover:border-rose-700 text-slate-400 hover:text-rose-200 rounded font-bold transition text-[11px]"
                            >
                              ✕
                            </button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
