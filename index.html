<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>MatTrack - Wrestling Stats & Mat-Side Scoring</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    button, input, select {
      touch-action: manipulation;
    }
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased select-none min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const playBuzzer = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {
        console.log("Audio waiting for user gesture");
      }
    };

    const DEFAULT_ROSTER = [
      { id: "w1", name: "Marcus Vance", weight: "138", grade: "Sr" },
      { id: "w2", name: "Sam Cole", weight: "144", grade: "Jr" },
      { id: "w3", name: "David Ruiz", weight: "157", grade: "So" },
      { id: "w4", name: "Tyler King", weight: "165", grade: "Sr" }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        return localStorage.getItem("mattrack_active_user") || null;
      });

      const [view, setView] = useState("scorer"); // 'scorer' | 'dual' | 'tournament' | 'wrestleoff' | 'roster'
      const [roster, setRoster] = useState([]);
      const [matches, setMatches] = useState([]);
      const [editingMatch, setEditingMatch] = useState(null);
      const [viewingTimelineMatch, setViewingTimelineMatch] = useState(null);
      const [editingWrestler, setEditingWrestler] = useState(null);

      useEffect(() => {
        if (currentUser) {
          const userKey = `mattrack_data_${currentUser.toLowerCase()}`;
          const savedData = localStorage.getItem(userKey);
          if (savedData) {
            try {
              const parsed = JSON.parse(savedData);
              setRoster(parsed.roster || []);
              setMatches(parsed.matches || []);
            } catch (e) {
              setRoster(DEFAULT_ROSTER);
              setMatches([]);
            }
          } else {
            setRoster(DEFAULT_ROSTER);
            setMatches([]);
          }
          localStorage.setItem("mattrack_active_user", currentUser);
        } else {
          setRoster([]);
          setMatches([]);
          localStorage.removeItem("mattrack_active_user");
        }
      }, [currentUser]);

      useEffect(() => {
        if (currentUser) {
          const userKey = `mattrack_data_${currentUser.toLowerCase()}`;
          localStorage.setItem(userKey, JSON.stringify({ roster, matches }));
        }
      }, [roster, matches, currentUser]);

      const handleLogin = (username) => {
        setCurrentUser(username);
        setView("scorer");
      };

      const handleSignOut = () => {
        if (confirm("Are you sure you want to sign out?")) {
          setCurrentUser(null);
        }
      };

      const handleSaveMatch = (newMatch) => {
        setMatches([newMatch, ...matches]);
        if (newMatch.eventType === "dual") setView("dual");
        else if (newMatch.eventType === "tournament") setView("tournament");
        else setView("wrestleoff");
      };

      const handleUpdateMatch = (updatedMatch) => {
        setMatches(matches.map(m => m.id === updatedMatch.id ? updatedMatch : m));
        setEditingMatch(null);
      };

      const handleDeleteMatch = (id) => {
        if (confirm("Are you sure you want to delete this match record?")) {
          setMatches(matches.filter(m => m.id !== id));
          setEditingMatch(null);
        }
      };

      const handleRemoveWrestler = (id, name) => {
        if (confirm(`Remove ${name} from the roster? Historical match records will remain intact.`)) {
          setRoster(roster.filter(w => w.id !== id));
        }
      };

      const handleSaveWrestlerEdit = (updatedWrestler, oldName) => {
        setRoster(roster.map(w => w.id === updatedWrestler.id ? updatedWrestler : w));
        if (oldName !== updatedWrestler.name) {
          setMatches(matches.map(m => {
            let mod = { ...m };
            if (mod.homeWrestler === oldName) mod.homeWrestler = updatedWrestler.name;
            if (mod.opponentName === oldName) mod.opponentName = updatedWrestler.name;
            return mod;
          }));
        }
        setEditingWrestler(null);
      };

      if (!currentUser) {
        return <AuthScreen onLogin={handleLogin} />;
      }

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-slate-950 text-slate-100">
          {/* Top Bar */}
          <nav className="flex items-center justify-between px-3 sm:px-6 py-2 bg-slate-900 border-b border-slate-800 shrink-0 gap-2">
            <div className="flex items-center gap-2">
              <div className="bg-amber-500 text-black p-1 rounded font-black text-sm tracking-tighter">
                MT
              </div>
              <span className="font-extrabold text-base tracking-wider text-white hidden lg:inline">
                MAT<span className="text-amber-400">TRACK</span>
              </span>
            </div>

            <div className="flex bg-slate-800/90 rounded-xl p-1 gap-1 border border-slate-700/50 overflow-x-auto">
              <button
                onClick={() => setView("scorer")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "scorer" ? "bg-amber-500 text-slate-950" : "text-slate-300 hover:text-white"
                }`}
              >
                Live Scorer
              </button>
              <button
                onClick={() => setView("dual")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "dual" ? "bg-blue-600 text-white" : "text-slate-300 hover:text-white"
                }`}
              >
                Dual Meets
              </button>
              <button
                onClick={() => setView("tournament")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "tournament" ? "bg-purple-600 text-white" : "text-slate-300 hover:text-white"
                }`}
              >
                Tournaments
              </button>
              <button
                onClick={() => setView("wrestleoff")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "wrestleoff" ? "bg-amber-600 text-white" : "text-slate-300 hover:text-white"
                }`}
              >
                Wrestle-Offs
              </button>
              <button
                onClick={() => setView("roster")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "roster" ? "bg-emerald-600 text-white" : "text-slate-300 hover:text-white"
                }`}
              >
                Roster
              </button>
            </div>

            <div className="flex items-center gap-2 bg-slate-800/60 border border-slate-700/60 rounded-xl px-2.5 py-1 shrink-0">
              <div className="flex flex-col text-right">
                <span className="text-[9px] text-slate-400 uppercase font-bold tracking-wider leading-none">
                  Coach
                </span>
                <span className="text-xs font-black text-amber-400 leading-tight">
                  {currentUser}
                </span>
              </div>
              <button
                onClick={handleSignOut}
                title="Sign Out"
                className="ml-1 p-1 bg-slate-700 hover:bg-rose-900 text-slate-300 hover:text-white rounded text-[10px] font-bold uppercase transition"
              >
                Log Out
              </button>
            </div>
          </nav>

          <main className="flex-1 overflow-auto min-h-0">
            {view === "scorer" && (
              <LiveScorer roster={roster} onSaveMatch={handleSaveMatch} />
            )}
            {view === "dual" && (
              <MatchesTableView
                title="Dual Meets Performance"
                subtitle="Head-to-head dual matches (Fall = 6, Tech = 5, Major = 4, Dec = 3)"
                matches={matches.filter(m => m.eventType === "dual")}
                onEditMatch={setEditingMatch}
                onViewTimeline={setViewingTimelineMatch}
                type="dual"
              />
            )}
            {view === "tournament" && (
              <MatchesTableView
                title="Tournament Brackets & Bonus"
                subtitle="Advancements (2 pts) + Bonus (Fall: +2, Tech: +1.5, Maj: +1)"
                matches={matches.filter(m => m.eventType === "tournament")}
                onEditMatch={setEditingMatch}
                onViewTimeline={setViewingTimelineMatch}
                type="tournament"
              />
            )}
            {view === "wrestleoff" && (
              <MatchesTableView
                title="Intrasquad Wrestle-Offs"
                subtitle="Head-to-head challenges between teammates for varsity spots"
                matches={matches.filter(m => m.eventType === "wrestleoff")}
                onEditMatch={setEditingMatch}
                onViewTimeline={setViewingTimelineMatch}
                type="wrestleoff"
              />
            )}
            {view === "roster" && (
              <RosterView
                roster={roster}
                setRoster={setRoster}
                matches={matches}
                onRemoveWrestler={handleRemoveWrestler}
                onEditWrestler={setEditingWrestler}
              />
            )}
          </main>

          {viewingTimelineMatch && (
            <ScoringTimelineModal
              match={viewingTimelineMatch}
              onClose={() => setViewingTimelineMatch(null)}
            />
          )}

          {editingMatch && (
            <EditMatchModal
              match={editingMatch}
              roster={roster}
              onSave={handleUpdateMatch}
              onDelete={handleDeleteMatch}
              onClose={() => setEditingMatch(null)}
            />
          )}

          {editingWrestler && (
            <EditWrestlerModal
              wrestler={editingWrestler}
              onSave={handleSaveWrestlerEdit}
              onClose={() => setEditingWrestler(null)}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // AUTHENTICATION
    // =========================================================================
    function AuthScreen({ onLogin }) {
      const [isRegistering, setIsRegistering] = useState(false);
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");

      const getUsers = () => {
        const raw = localStorage.getItem("mattrack_registered_users");
        return raw ? JSON.parse(raw) : {};
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setError("");
        const clean = username.trim();
        if (!clean || !password) {
          setError("Please enter both username and password.");
          return;
        }

        const users = getUsers();
        const key = clean.toLowerCase();

        if (isRegistering) {
          if (users[key]) {
            setError("That team username is already registered. Please sign in.");
            return;
          }
          users[key] = { username: clean, password };
          localStorage.setItem("mattrack_registered_users", JSON.stringify(users));
          onLogin(clean);
        } else {
          if (!users[key] || users[key].password !== password) {
            setError("Invalid username or password.");
            return;
          }
          onLogin(users[key].username);
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4">
          <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
            <div className="text-center mb-6">
              <div className="inline-flex bg-amber-500 text-black px-3 py-1 rounded-xl font-black text-xl tracking-tighter mb-2">
                MT
              </div>
              <h1 className="text-2xl font-black text-white uppercase tracking-tight">
                Mat<span className="text-amber-400">Track</span>
              </h1>
              <p className="text-xs text-slate-400 mt-1">
                Wrestling Season Stats, Wrestle-Offs & Scoring
              </p>
            </div>

            {error && (
              <div className="mb-4 p-2.5 bg-rose-950/80 border border-rose-700/60 rounded-xl text-xs font-semibold text-rose-300 text-center">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">
                  Coach / Team Username
                </label>
                <input
                  type="text"
                  required
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  placeholder="e.g. CoachSmith"
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                />
              </div>

              <div>
                <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">
                  Password
                </label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                />
              </div>

              <button
                type="submit"
                className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-black text-sm uppercase tracking-wider transition active:scale-98 shadow-lg shadow-amber-500/20"
              >
                {isRegistering ? "Create Team Account" : "Sign In to Team"}
              </button>
            </form>

            <div className="mt-6 pt-4 border-t border-slate-800/80 text-center text-xs">
              {isRegistering ? (
                <span className="text-slate-400">
                  Already have an account?{" "}
                  <button onClick={() => { setIsRegistering(false); setError(""); }} className="text-amber-400 font-bold hover:underline">
                    Sign In
                  </button>
                </span>
              ) : (
                <span className="text-slate-400">
                  Need a private team workspace?{" "}
                  <button onClick={() => { setIsRegistering(true); setError(""); }} className="text-amber-400 font-bold hover:underline">
                    Create an Account
                  </button>
                </span>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENT: LIVE SCORER
    // =========================================================================
    function LiveScorer({ roster, onSaveMatch }) {
      const [eventType, setEventType] = useState("dual");
      const [eventName, setEventName] = useState("Dual vs Opponent");
      const [weightClass, setWeightClass] = useState("157");
      
      const [homeWrestler, setHomeWrestler] = useState(roster[0]?.name || "Home Wrestler");
      const [awayWrestler, setAwayWrestler] = useState(roster[1]?.name || "Opponent");

      useEffect(() => {
        if (roster.length > 0 && !roster.find(w => w.name === homeWrestler)) {
          setHomeWrestler(roster[0].name);
        }
        if (eventType === "wrestleoff" && roster.length > 1 && !roster.find(w => w.name === awayWrestler)) {
          setAwayWrestler(roster[1]?.name || roster[0]?.name);
        }
      }, [roster, eventType]);

      // Clock
      const PERIOD_LEN = 120;
      const OT_LEN = 60;
      const [period, setPeriod] = useState(1);
      const [secondsLeft, setSecondsLeft] = useState(PERIOD_LEN);
      const [isRunning, setIsRunning] = useState(false);
      const [isEditingClock, setIsEditingClock] = useState(false);
      const [manualClockInput, setManualClockInput] = useState("");

      // Choice Transition State (1->2 or 2->3)
      const [choiceModal, setChoiceModal] = useState(null); // { nextPeriod: 2 | 3, chooser: 'home' | 'away' }
      const [deferredToP3Chooser, setDeferredToP3Chooser] = useState(null);

      // Score
      const [homeScore, setHomeScore] = useState(0);
      const [awayScore, setAwayScore] = useState(0);
      const [history, setHistory] = useState([]);
      const [isFinished, setIsFinished] = useState(false);
      const [finishType, setFinishType] = useState(null);

      // Penalty Dialog
      const [penaltyTarget, setPenaltyTarget] = useState(null);

      useEffect(() => {
        let interval = null;
        if (isRunning && secondsLeft > 0) {
          interval = setInterval(() => setSecondsLeft(prev => prev - 1), 1000);
        } else if (secondsLeft === 0 && isRunning) {
          setIsRunning(false);
          playBuzzer();
          initiatePeriodTransition();
        }
        return () => clearInterval(interval);
      }, [isRunning, secondsLeft]);

      useEffect(() => {
        if (Math.abs(homeScore - awayScore) >= 15 && !isFinished) {
          setIsRunning(false);
          finishMatch(homeScore > awayScore ? "home" : "away", "Tech Fall");
        }
      }, [homeScore, awayScore]);

      const initiatePeriodTransition = () => {
        setIsRunning(false);
        if (period === 1) {
          setChoiceModal({ nextPeriod: 2, chooser: "home" });
        } else if (period === 2) {
          const p3Chooser = deferredToP3Chooser || "away";
          setChoiceModal({ nextPeriod: 3, chooser: p3Chooser });
        } else if (period === 3) {
          if (homeScore === awayScore) {
            setPeriod("OT");
            setSecondsLeft(OT_LEN);
            logAction("SYS", "OT", 0, "Overtime Started: Sudden Victory (1:00 Neutral)");
          } else {
            const diff = Math.abs(homeScore - awayScore);
            finishMatch(homeScore > awayScore ? "home" : "away", diff >= 8 ? "Major Decision" : "Decision");
          }
        } else if (period === "OT") {
          const winner = homeScore >= awayScore ? "home" : "away";
          finishMatch(winner, "Decision (OT)");
        }
      };

      const handleConfirmChoice = (chosenPosition, chooserSide) => {
        const nextP = choiceModal.nextPeriod;
        const chooserName = chooserSide === "home" ? homeWrestler : awayWrestler;

        if (chosenPosition === "Defer") {
          setDeferredToP3Chooser(chooserSide);
          const otherSide = chooserSide === "home" ? "away" : "home";
          const otherName = otherSide === "home" ? homeWrestler : awayWrestler;
          logAction("SYS", "CHOICE", 0, `${chooserName} Deferred. ${otherName}'s choice in Period 2.`);
          setChoiceModal({ nextPeriod: 2, chooser: otherSide, isAfterDefer: true });
          return;
        }

        logAction(
          "SYS",
          "CHOICE",
          0,
          `Period ${nextP} Choice: ${chooserName} chose ${chosenPosition}`
        );

        setPeriod(nextP);
        setSecondsLeft(PERIOD_LEN);
        setChoiceModal(null);
      };

      const finishMatch = (winnerSide, type) => {
        setIsRunning(false);
        setIsFinished(true);
        setFinishType(type);
      };

      const logAction = (side, code, points, description) => {
        const entry = {
          id: Math.random().toString(36).substring(2, 7),
          side,
          code,
          points,
          description: description || code,
          period,
          seconds: secondsLeft,
          timeFormatted: formatTime(secondsLeft)
        };
        setHistory(prev => [entry, ...prev]);
      };

      const addScore = (side, code, points, description) => {
        if (isFinished) return;
        if (side === "home") setHomeScore(s => s + points);
        if (side === "away") setAwayScore(s => s + points);
        logAction(side, code, points, description);
      };

      const awardPenalty = (awardedToSide, penaltyName) => {
        addScore(awardedToSide, "PEN", 1, `Penalty: ${penaltyName}`);
        setPenaltyTarget(null);
      };

      const adjustClock = (deltaSeconds) => {
        setSecondsLeft(prev => Math.max(0, prev + deltaSeconds));
      };

      const handleManualClockSubmit = (e) => {
        e.preventDefault();
        const input = manualClockInput.trim();
        let total = 0;
        if (input.includes(":")) {
          const parts = input.split(":");
          const m = parseInt(parts[0], 10) || 0;
          const s = parseInt(parts[1], 10) || 0;
          total = m * 60 + s;
        } else {
          total = parseInt(input, 10) || 0;
        }
        setSecondsLeft(Math.max(0, total));
        setIsEditingClock(false);
        setManualClockInput("");
      };

      const undo = () => {
        if (history.length === 0) return;
        const [last, ...rest] = history;
        if (last.side === "home") setHomeScore(s => Math.max(0, s - last.points));
        if (last.side === "away") setAwayScore(s => Math.max(0, s - last.points));
        setHistory(rest);
      };

      const resetMatch = () => {
        setIsRunning(false);
        setPeriod(1);
        setSecondsLeft(PERIOD_LEN);
        setHomeScore(0);
        setAwayScore(0);
        setHistory([]);
        setIsFinished(false);
        setFinishType(null);
        setChoiceModal(null);
        setDeferredToP3Chooser(null);
      };

      const commitResult = () => {
        const winner = homeScore > awayScore ? "home" : awayScore > homeScore ? "away" : "tie";
        const isHomeWinner = winner === "home";

        let dualPts = 0;
        if (eventType === "dual" && isHomeWinner) {
          if (finishType === "Fall" || finishType === "Forfeit") dualPts = 6;
          else if (finishType === "Tech Fall") dualPts = 5;
          else if (finishType === "Major Decision") dualPts = 4;
          else dualPts = 3;
        }

        let tourneyPts = 0;
        if (eventType === "tournament" && isHomeWinner) {
          tourneyPts = 2;
          if (finishType === "Fall") tourneyPts += 2;
          else if (finishType === "Tech Fall") tourneyPts += 1.5;
          else if (finishType === "Major Decision") tourneyPts += 1;
        }

        const statsHome = history.reduce(
          (acc, item) => {
            if (item.side === "home") {
              if (item.code === "TD") acc.td += 1;
              if (item.code === "E") acc.e += 1;
              if (item.code === "REV") acc.rev += 1;
              if (item.code.startsWith("NF")) acc.nf += 1;
              if (item.code === "PEN") acc.pen += 1;
            }
            return acc;
          },
          { td: 0, e: 0, rev: 0, nf: 0, pen: 0 }
        );

        const statsAway = history.reduce(
          (acc, item) => {
            if (item.side === "away") {
              if (item.code === "TD") acc.td += 1;
              if (item.code === "E") acc.e += 1;
              if (item.code === "REV") acc.rev += 1;
              if (item.code.startsWith("NF")) acc.nf += 1;
              if (item.code === "PEN") acc.pen += 1;
            }
            return acc;
          },
          { td: 0, e: 0, rev: 0, nf: 0, pen: 0 }
        );

        const record = {
          id: "m_" + Date.now(),
          eventType,
          eventName: eventName || (eventType === "dual" ? "Dual Meet" : eventType === "tournament" ? "Tournament" : "Varsity Wrestle-Off"),
          homeWrestler,
          opponentName: awayWrestler,
          weightClass,
          homeScore,
          awayScore,
          winner,
          winType: finishType || "Decision",
          dualPointsAwarded: dualPts,
          tourneyPointsAwarded: tourneyPts,
          takedowns: statsHome.td,
          escapes: statsHome.e,
          reversals: statsHome.rev,
          nearfalls: statsHome.nf,
          penaltiesAwarded: statsHome.pen,
          awayTakedowns: statsAway.td,
          awayEscapes: statsAway.e,
          awayReversals: statsAway.rev,
          awayNearfalls: statsAway.nf,
          awayPenaltiesAwarded: statsAway.pen,
          history: [...history].reverse(),
          date: new Date().toISOString().split("T")[0]
        };

        onSaveMatch(record);
        resetMatch();
      };

      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec < 10 ? "0" : ""}${sec}`;
      };

      return (
        <div className="flex flex-col h-full bg-slate-950 p-2 sm:p-3 gap-2 select-none">
          {/* Header Controls & Master Clock */}
          <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-900 border border-slate-800 p-2.5 rounded-2xl shrink-0">
            <div className="flex items-center gap-2">
              <select
                value={eventType}
                onChange={(e) => {
                  setEventType(e.target.value);
                  if (e.target.value === "wrestleoff") {
                    setEventName("Varsity Wrestle-Off");
                    if (roster.length > 1) setAwayWrestler(roster[1].name);
                  }
                }}
                className={`px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider ${
                  eventType === "dual"
                    ? "bg-blue-600 text-white"
                    : eventType === "tournament"
                    ? "bg-purple-600 text-white"
                    : "bg-amber-600 text-white"
                }`}
              >
                <option value="dual">Dual Meet</option>
                <option value="tournament">Tournament</option>
                <option value="wrestleoff">Wrestle-Off</option>
              </select>

              <input
                type="text"
                value={eventName}
                onChange={(e) => setEventName(e.target.value)}
                placeholder="Opponent / Tournament"
                className="bg-slate-800 border border-slate-700 px-3 py-1 rounded-lg text-xs font-semibold focus:outline-none text-slate-200 w-36 sm:w-44"
              />

              <div className="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg">
                <span className="text-[11px] text-slate-400 font-bold">WT:</span>
                <input
                  type="text"
                  value={weightClass}
                  onChange={(e) => setWeightClass(e.target.value)}
                  className="w-9 bg-transparent text-center text-xs font-black text-white focus:outline-none"
                />
              </div>
            </div>

            {/* Interactive Clock & Adjuster Bar */}
            <div className="flex items-center gap-3 bg-slate-950/60 border border-slate-800/80 px-3 py-1.5 rounded-xl">
              {/* Minus Time Quick Buttons */}
              <div className="flex flex-col gap-1">
                <button
                  onClick={() => adjustClock(-10)}
                  title="Minus 10 seconds"
                  className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-[10px] font-mono font-bold rounded text-slate-300"
                >
                  -10s
                </button>
                <button
                  onClick={() => adjustClock(-1)}
                  title="Minus 1 second"
                  className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-[10px] font-mono font-bold rounded text-slate-300"
                >
                  -1s
                </button>
              </div>

              {/* Main Period Clock Display & Manual Edit */}
              <div className="text-center min-w-[100px]">
                <div className="text-[10px] uppercase tracking-widest text-slate-400 font-bold">
                  {period === "OT" ? "Overtime" : `Period ${period}`}
                </div>

                {isEditingClock ? (
                  <form onSubmit={handleManualClockSubmit} className="my-0.5">
                    <input
                      type="text"
                      autoFocus
                      placeholder="e.g. 1:15"
                      value={manualClockInput}
                      onChange={(e) => setManualClockInput(e.target.value)}
                      onBlur={() => setIsEditingClock(false)}
                      className="w-24 text-center font-mono font-black text-2xl bg-slate-800 border border-amber-400 rounded text-amber-300 focus:outline-none"
                    />
                  </form>
                ) : (
                  <div
                    onClick={() => {
                      setIsRunning(false);
                      setManualClockInput(formatTime(secondsLeft));
                      setIsEditingClock(true);
                    }}
                    title="Click to manually edit clock"
                    className={`text-4xl sm:text-5xl font-mono font-black tracking-tight cursor-pointer hover:text-amber-400 transition ${
                      secondsLeft <= 10 && isRunning ? "text-red-500 animate-pulse" : "text-white"
                    }`}
                  >
                    {formatTime(secondsLeft)}
                  </div>
                )}
                <div className="text-[9px] text-slate-500 font-semibold tracking-tight">tap time to edit</div>
              </div>

              {/* Plus Time Quick Buttons */}
              <div className="flex flex-col gap-1">
                <button
                  onClick={() => adjustClock(10)}
                  title="Plus 10 seconds"
                  className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-[10px] font-mono font-bold rounded text-slate-300"
                >
                  +10s
                </button>
                <button
                  onClick={() => adjustClock(1)}
                  title="Plus 1 second"
                  className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-[10px] font-mono font-bold rounded text-slate-300"
                >
                  +1s
                </button>
              </div>

              {/* Play / Pause / Reset */}
              <div className="flex items-center gap-1.5 ml-2">
                <button
                  onClick={() => setIsRunning(!isRunning)}
                  className={`px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition ${
                    isRunning ? "bg-amber-500 text-black hover:bg-amber-400" : "bg-emerald-500 text-black hover:bg-emerald-400"
                  }`}
                >
                  {isRunning ? "Pause" : "Start"}
                </button>
                <button
                  onClick={() => {
                    setIsRunning(false);
                    setSecondsLeft(period === "OT" ? OT_LEN : PERIOD_LEN);
                  }}
                  className="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 font-bold text-xs"
                  title="Reset Period Clock"
                >
                  ↺
                </button>
              </div>
            </div>

            {/* Undo & Period Advance */}
            <div className="flex items-center gap-2">
              <button
                onClick={undo}
                disabled={history.length === 0}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 rounded-lg text-xs font-bold text-slate-300"
              >
                Undo
              </button>
              <button
                onClick={initiatePeriodTransition}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-300 flex items-center gap-1"
              >
                <span>End Period</span>
                <span>→</span>
              </button>
            </div>
          </div>

          {/* Scoring Pads */}
          <div className="flex-1 grid grid-cols-1 md:grid-cols-2 gap-3 min-h-0">
            {/* GREEN / HOME CORNER */}
            <div className="flex flex-col bg-emerald-950/20 border-2 border-emerald-500/30 rounded-2xl p-3 justify-between min-h-0">
              <div className="flex items-center justify-between border-b border-emerald-800/40 pb-1.5">
                <div className="flex-1 mr-2">
                  <div className="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">
                    Green / {eventType === "wrestleoff" ? "Wrestler 1" : "Home"}
                  </div>
                  <select
                    value={homeWrestler}
                    onChange={(e) => setHomeWrestler(e.target.value)}
                    className="bg-transparent text-lg sm:text-xl font-black text-emerald-300 focus:outline-none w-full"
                  >
                    {roster.map(w => (
                      <option key={w.id} value={w.name} className="bg-slate-900 text-white">
                        {w.name} ({w.weight} lbs)
                      </option>
                    ))}
                    <option value="Other Wrestler" className="bg-slate-900 text-white">Other...</option>
                  </select>
                </div>
                <div className="text-6xl sm:text-7xl font-mono font-black text-emerald-400">
                  {homeScore}
                </div>
              </div>

              {/* ACTION GRID */}
              <div className="grid grid-cols-3 gap-2 my-1.5 flex-1">
                <button
                  onClick={() => addScore("home", "TD", 3, "Takedown")}
                  className="bg-emerald-600 hover:bg-emerald-500 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>TAKEDOWN</span>
                  <span>+3</span>
                </button>
                <button
                  onClick={() => addScore("home", "E", 1, "Escape")}
                  className="bg-emerald-700 hover:bg-emerald-600 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>ESCAPE</span>
                  <span>+1</span>
                </button>
                <button
                  onClick={() => addScore("home", "REV", 2, "Reversal")}
                  className="bg-emerald-700 hover:bg-emerald-600 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>REVERSAL</span>
                  <span>+2</span>
                </button>
                <button
                  onClick={() => addScore("home", "NF2", 2, "Near Fall (2)")}
                  className="bg-emerald-800 hover:bg-emerald-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+2</span>
                </button>
                <button
                  onClick={() => addScore("home", "NF3", 3, "Near Fall (3)")}
                  className="bg-emerald-800 hover:bg-emerald-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+3</span>
                </button>
                <button
                  onClick={() => addScore("home", "NF4", 4, "Near Fall (4)")}
                  className="bg-emerald-800 hover:bg-emerald-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+4</span>
                </button>
              </div>

              <div className="flex gap-2">
                <button
                  onClick={() => setPenaltyTarget("home")}
                  className="flex-1 py-2 bg-amber-500/20 border border-amber-500/60 hover:bg-amber-500 hover:text-black text-amber-300 font-bold text-xs rounded-xl uppercase transition"
                >
                  AWARD PENALTY ⚠️
                </button>
                <button
                  onClick={() => finishMatch("home", "Fall")}
                  className="flex-1 py-2 bg-emerald-500/20 border border-emerald-500 text-emerald-300 font-black text-xs rounded-xl uppercase hover:bg-emerald-500 hover:text-black transition"
                >
                  PIN / FALL ⚡
                </button>
              </div>
            </div>

            {/* RED / AWAY CORNER */}
            <div className="flex flex-col bg-rose-950/20 border-2 border-rose-500/30 rounded-2xl p-3 justify-between min-h-0">
              <div className="flex items-center justify-between border-b border-rose-800/40 pb-1.5">
                <div className="flex-1 mr-2">
                  <div className="text-[10px] font-bold text-rose-400 uppercase tracking-widest">
                    Red / {eventType === "wrestleoff" ? "Wrestler 2 (Teammate)" : "Opponent"}
                  </div>
                  {eventType === "wrestleoff" ? (
                    <select
                      value={awayWrestler}
                      onChange={(e) => setAwayWrestler(e.target.value)}
                      className="bg-transparent text-lg sm:text-xl font-black text-rose-300 focus:outline-none w-full"
                    >
                      {roster.map(w => (
                        <option key={w.id} value={w.name} className="bg-slate-900 text-white">
                          {w.name} ({w.weight} lbs)
                        </option>
                      ))}
                      <option value="Other Wrestler" className="bg-slate-900 text-white">Other...</option>
                    </select>
                  ) : (
                    <input
                      type="text"
                      value={awayWrestler}
                      onChange={(e) => setAwayWrestler(e.target.value)}
                      className="bg-transparent text-lg sm:text-xl font-black text-rose-300 focus:outline-none w-full uppercase"
                    />
                  )}
                </div>
                <div className="text-6xl sm:text-7xl font-mono font-black text-rose-400">
                  {awayScore}
                </div>
              </div>

              {/* ACTION GRID */}
              <div className="grid grid-cols-3 gap-2 my-1.5 flex-1">
                <button
                  onClick={() => addScore("away", "TD", 3, "Takedown")}
                  className="bg-rose-600 hover:bg-rose-500 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>TAKEDOWN</span>
                  <span>+3</span>
                </button>
                <button
                  onClick={() => addScore("away", "E", 1, "Escape")}
                  className="bg-rose-700 hover:bg-rose-600 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>ESCAPE</span>
                  <span>+1</span>
                </button>
                <button
                  onClick={() => addScore("away", "REV", 2, "Reversal")}
                  className="bg-rose-700 hover:bg-rose-600 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>REVERSAL</span>
                  <span>+2</span>
                </button>
                <button
                  onClick={() => addScore("away", "NF2", 2, "Near Fall (2)")}
                  className="bg-rose-800 hover:bg-rose-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+2</span>
                </button>
                <button
                  onClick={() => addScore("away", "NF3", 3, "Near Fall (3)")}
                  className="bg-rose-800 hover:bg-rose-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+3</span>
                </button>
                <button
                  onClick={() => addScore("away", "NF4", 4, "Near Fall (4)")}
                  className="bg-rose-800 hover:bg-rose-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+4</span>
                </button>
              </div>

              <div className="flex gap-2">
                <button
                  onClick={() => setPenaltyTarget("away")}
                  className="flex-1 py-2 bg-amber-500/20 border border-amber-500/60 hover:bg-amber-500 hover:text-black text-amber-300 font-bold text-xs rounded-xl uppercase transition"
                >
                  AWARD PENALTY ⚠️
                </button>
                <button
                  onClick={() => finishMatch("away", "Fall")}
                  className="flex-1 py-2 bg-rose-500/20 border border-rose-500 text-rose-300 font-black text-xs rounded-lg uppercase hover:bg-rose-500 hover:text-black transition"
                >
                  PIN / FALL ⚡
                </button>
              </div>
            </div>
          </div>

          {/* Action Log Bar */}
          <div className="h-9 bg-slate-900 border border-slate-800 rounded-xl flex items-center px-3 overflow-x-auto gap-2 text-xs shrink-0">
            <span className="font-bold text-slate-500 uppercase text-[10px] shrink-0">Live Log:</span>
            {history.length === 0 && <span className="text-slate-500 italic">No score actions logged yet.</span>}
            {history.map(item => (
              <span
                key={item.id}
                className={`px-2 py-0.5 rounded font-mono shrink-0 text-xs font-semibold ${
                  item.side === "SYS"
                    ? "bg-amber-950/80 text-amber-300 border border-amber-800"
                    : item.side === "home"
                    ? "bg-emerald-950 text-emerald-300 border border-emerald-800"
                    : "bg-rose-950 text-rose-300 border border-rose-800"
                }`}
              >
                {item.side === "SYS" ? "POS" : item.side === "home" ? "GRN" : "RED"} {item.points > 0 ? `+${item.points} ` : ""}({item.description || item.code}) P{item.period} [{item.timeFormatted}]
              </span>
            ))}
          </div>

          {/* PERIOD TRANSITION CHOICE MODAL (TOP, BOTTOM, NEUTRAL, DEFER) */}
          {choiceModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl space-y-4">
                <div className="text-3xl mb-1">🤼‍♂️</div>
                <h3 className="text-xl font-black uppercase text-white tracking-wide">
                  Period {choiceModal.nextPeriod} Starting Position
                </h3>

                <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                  <span className="text-xs text-slate-400 block mb-1 font-semibold uppercase">
                    Wrestler with Choice:
                  </span>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setChoiceModal({ ...choiceModal, chooser: "home" })}
                      className={`flex-1 py-2 rounded-lg font-bold text-xs uppercase transition border ${
                        choiceModal.chooser === "home"
                          ? "bg-emerald-600 border-emerald-400 text-white"
                          : "bg-slate-800 border-slate-700 text-slate-400 hover:text-white"
                      }`}
                    >
                      Green ({homeWrestler})
                    </button>
                    <button
                      type="button"
                      onClick={() => setChoiceModal({ ...choiceModal, chooser: "away" })}
                      className={`flex-1 py-2 rounded-lg font-bold text-xs uppercase transition border ${
                        choiceModal.chooser === "away"
                          ? "bg-rose-600 border-rose-400 text-white"
                          : "bg-slate-800 border-slate-700 text-slate-400 hover:text-white"
                      }`}
                    >
                      Red ({awayWrestler})
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2.5 pt-1">
                  <button
                    onClick={() => handleConfirmChoice("Top", choiceModal.chooser)}
                    className="p-3.5 bg-slate-800 hover:bg-emerald-600 hover:text-white rounded-xl font-black text-sm uppercase tracking-wider transition border border-slate-700"
                  >
                    TOP (Offense)
                  </button>
                  <button
                    onClick={() => handleConfirmChoice("Bottom", choiceModal.chooser)}
                    className="p-3.5 bg-slate-800 hover:bg-emerald-600 hover:text-white rounded-xl font-black text-sm uppercase tracking-wider transition border border-slate-700"
                  >
                    BOTTOM (Defense)
                  </button>
                  <button
                    onClick={() => handleConfirmChoice("Neutral", choiceModal.chooser)}
                    className="p-3.5 bg-slate-800 hover:bg-emerald-600 hover:text-white rounded-xl font-black text-sm uppercase tracking-wider transition border border-slate-700"
                  >
                    NEUTRAL (Feet)
                  </button>
                  {choiceModal.nextPeriod === 2 && !choiceModal.isAfterDefer && (
                    <button
                      onClick={() => handleConfirmChoice("Defer", choiceModal.chooser)}
                      className="p-3.5 bg-slate-800 hover:bg-amber-600 hover:text-black rounded-xl font-black text-sm uppercase tracking-wider transition border border-slate-700"
                    >
                      DEFER CHOICE ↷
                    </button>
                  )}
                </div>

                <button
                  onClick={() => setChoiceModal(null)}
                  className="text-xs text-slate-500 hover:text-slate-300 font-bold uppercase pt-2"
                >
                  Skip / Keep Current
                </button>
              </div>
            </div>
          )}

          {/* PENALTY SELECTION MODAL */}
          {penaltyTarget && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-amber-500/40 rounded-2xl max-w-sm w-full p-5 text-center shadow-2xl space-y-4">
                <div className="text-3xl mb-1">⚠️</div>
                <h3 className="text-lg font-black uppercase text-white tracking-wide">
                  Award Penalty Point to {penaltyTarget === "home" ? "Green (Home)" : "Red (Away)"}
                </h3>
                <p className="text-xs text-slate-400">
                  Select the specific infraction committed by {penaltyTarget === "home" ? awayWrestler : homeWrestler}:
                </p>

                <div className="grid grid-cols-1 gap-2 text-left">
                  <button
                    onClick={() => awardPenalty(penaltyTarget, "Locked Hands / Clasping")}
                    className="p-3 bg-slate-800 hover:bg-amber-600 hover:text-black rounded-xl font-bold text-xs flex justify-between items-center transition"
                  >
                    <span>Locked Hands / Clasping</span>
                    <span className="font-mono font-black">+1 PT</span>
                  </button>
                  <button
                    onClick={() => awardPenalty(penaltyTarget, "Unnecessary Roughness")}
                    className="p-3 bg-slate-800 hover:bg-amber-600 hover:text-black rounded-xl font-bold text-xs flex justify-between items-center transition"
                  >
                    <span>Unnecessary Roughness</span>
                    <span className="font-mono font-black">+1 PT</span>
                  </button>
                  <button
                    onClick={() => awardPenalty(penaltyTarget, "False Start / Caution Penalty")}
                    className="p-3 bg-slate-800 hover:bg-amber-600 hover:text-black rounded-xl font-bold text-xs flex justify-between items-center transition"
                  >
                    <span>False Start / Caution Penalty</span>
                    <span className="font-mono font-black">+1 PT</span>
                  </button>
                  <button
                    onClick={() => awardPenalty(penaltyTarget, "Illegal Hold or Maneuver")}
                    className="p-3 bg-slate-800 hover:bg-amber-600 hover:text-black rounded-xl font-bold text-xs flex justify-between items-center transition"
                  >
                    <span>Illegal Hold or Maneuver</span>
                    <span className="font-mono font-black">+1 PT</span>
                  </button>
                </div>

                <button
                  onClick={() => setPenaltyTarget(null)}
                  className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold text-xs uppercase"
                >
                  Cancel
                </button>
              </div>
            </div>
          )}

          {/* Finished Match Dialog */}
          {isFinished && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
                <div className="text-3xl mb-1">🏆</div>
                <h3 className="text-xl font-black uppercase tracking-wider text-white">
                  Match Concluded
                </h3>
                <div className="text-sm font-semibold text-amber-400 mt-1">
                  Result: {finishType}
                </div>

                <div className="flex items-center justify-around my-5 py-3 bg-slate-800 rounded-xl">
                  <div>
                    <div className="text-xs font-bold text-emerald-400">{homeWrestler}</div>
                    <div className="text-3xl font-mono font-black">{homeScore}</div>
                  </div>
                  <div className="text-slate-500 font-bold">vs</div>
                  <div>
                    <div className="text-xs font-bold text-rose-400">{awayWrestler}</div>
                    <div className="text-3xl font-mono font-black">{awayScore}</div>
                  </div>
                </div>

                <div className="text-xs text-slate-400 mb-5">
                  {eventType === "dual" && (
                    <span>
                      Dual Team Points to award:{" "}
                      <strong className="text-blue-400 font-bold text-sm">
                        {homeScore >= awayScore
                          ? finishType === "Fall" ? 6 : finishType === "Tech Fall" ? 5 : finishType === "Major Decision" ? 4 : 3
                          : 0} pts
                      </strong>
                    </span>
                  )}
                  {eventType === "tournament" && (
                    <span>
                      Tournament Advancement + Bonus:{" "}
                      <strong className="text-purple-400 font-bold text-sm">
                        {homeScore >= awayScore
                          ? finishType === "Fall" ? 4 : finishType === "Tech Fall" ? 3.5 : finishType === "Major Decision" ? 3 : 2
                          : 0} pts
                      </strong>
                    </span>
                  )}
                  {eventType === "wrestleoff" && (
                    <span className="text-amber-300 font-semibold">
                      Recorded to both wrestlers' season stat totals.
                    </span>
                  )}
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={resetMatch}
                    className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-xs uppercase"
                  >
                    Discard
                  </button>
                  <button
                    onClick={commitResult}
                    className="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black rounded-xl font-black text-xs uppercase tracking-wider"
                  >
                    Save & Submit
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // COMPONENT: MATCHES TABLE VIEW
    // =========================================================================
    function MatchesTableView({ title, subtitle, matches, onEditMatch, onViewTimeline, type }) {
      const totalTeamPts = matches.reduce((sum, m) => sum + (type === "dual" ? (m.dualPointsAwarded || 0) : (m.tourneyPointsAwarded || 0)), 0);
      const totalWins = matches.filter(m => m.winner === "home").length;

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-2xl font-black text-white uppercase tracking-tight">
                {title}
              </h2>
              <p className="text-xs text-slate-400 mt-0.5">{subtitle}</p>
            </div>
            {type !== "wrestleoff" && (
              <div className="flex gap-3">
                <div className="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-center">
                  <div className="text-[10px] text-slate-400 uppercase font-bold">Record</div>
                  <div className="text-xl font-mono font-black text-blue-400">
                    {totalWins}W - {matches.length - totalWins}L
                  </div>
                </div>
                <div className="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-center">
                  <div className="text-[10px] text-slate-400 uppercase font-bold">Team Points</div>
                  <div className="text-xl font-mono font-black text-amber-400">
                    {totalTeamPts}
                  </div>
                </div>
              </div>
            )}
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-800/70 uppercase text-slate-400 font-bold border-b border-slate-700">
                  <tr>
                    <th className="p-3">Date</th>
                    <th className="p-3">Event</th>
                    <th className="p-3">Weight</th>
                    <th className="p-3">{type === "wrestleoff" ? "Wrestler 1" : "Our Wrestler"}</th>
                    <th className="p-3">{type === "wrestleoff" ? "Wrestler 2" : "Opponent"}</th>
                    <th className="p-3 text-center">Final Score</th>
                    <th className="p-3">Result</th>
                    {type !== "wrestleoff" && <th className="p-3 text-center">Team Pts</th>}
                    <th className="p-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800 font-medium">
                  {matches.length === 0 ? (
                    <tr>
                      <td colSpan="9" className="p-6 text-center text-slate-500 italic">
                        No matches recorded yet for this category.
                      </td>
                    </tr>
                  ) : (
                    matches.map(m => (
                      <tr key={m.id} className="hover:bg-slate-800/40 transition">
                        <td className="p-3 font-mono text-slate-400">{m.date}</td>
                        <td className="p-3 font-bold text-white">{m.eventName}</td>
                        <td className="p-3 font-bold text-slate-300">{m.weightClass} lbs</td>
                        <td className="p-3 font-semibold text-emerald-400">{m.homeWrestler}</td>
                        <td className="p-3 font-semibold text-rose-400">{m.opponentName}</td>
                        <td className="p-3 text-center font-mono font-bold">
                          {m.homeScore} - {m.awayScore}
                        </td>
                        <td className="p-3">
                          <span
                            className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                              m.winner === "home"
                                ? "bg-emerald-950 text-emerald-300 border border-emerald-800"
                                : "bg-rose-950 text-rose-300 border border-rose-800"
                            }`}
                          >
                            {m.winType}
                          </span>
                        </td>
                        {type !== "wrestleoff" && (
                          <td className="p-3 text-center font-mono font-black text-amber-400">
                            +{type === "dual" ? m.dualPointsAwarded : m.tourneyPointsAwarded}
                          </td>
                        )}
                        <td className="p-3 text-right space-x-2 whitespace-nowrap">
                          <button
                            onClick={() => onViewTimeline(m)}
                            className="px-2.5 py-1 bg-amber-500/20 hover:bg-amber-500 hover:text-black border border-amber-500/40 text-amber-300 rounded text-[11px] font-bold transition"
                          >
                            Timeline ⏱
                          </button>
                          <button
                            onClick={() => onEditMatch(m)}
                            className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white rounded text-[11px] font-bold transition"
                          >
                            Edit
                          </button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: SCORING TIMELINE / BREAKDOWN
    // =========================================================================
    function ScoringTimelineModal({ match, onClose }) {
      const history = match.history || [];

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4 shrink-0">
              <div>
                <h3 className="text-lg font-black uppercase text-white tracking-wide">
                  Match Scoring Breakdown
                </h3>
                <span className="text-xs text-slate-400">
                  {match.homeWrestler} ({match.homeScore}) vs {match.opponentName} ({match.awayScore}) • {match.winType}
                </span>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-xl font-bold">
                ✕
              </button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2 pr-1">
              {history.length === 0 ? (
                <div className="p-8 text-center text-slate-500 italic text-sm">
                  No chronological point log found for this match (action totals were entered directly).
                </div>
              ) : (
                history.map((event, idx) => {
                  const isPenalty = event.code === "PEN";
                  const isPositionChoice = event.side === "SYS";
                  return (
                    <div
                      key={event.id || idx}
                      className={`flex items-center justify-between p-2.5 rounded-xl border ${
                        isPositionChoice
                          ? "bg-slate-800/60 border-amber-600/50 text-amber-200"
                          : isPenalty
                          ? "bg-amber-950/30 border-amber-700/60 text-amber-200"
                          : event.side === "home"
                          ? "bg-emerald-950/40 border-emerald-800/60 text-emerald-300"
                          : "bg-rose-950/40 border-rose-800/60 text-rose-300"
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <span className="w-6 h-6 rounded-full flex items-center justify-center font-black text-xs bg-slate-900 border border-slate-700 text-slate-300">
                          {idx + 1}
                        </span>
                        <div>
                          <div className="font-extrabold text-sm text-white flex items-center gap-1.5">
                            <span>
                              {isPositionChoice
                                ? "Position Transition"
                                : event.side === "home"
                                ? match.homeWrestler
                                : match.opponentName}
                            </span>
                            {isPenalty && (
                              <span className="text-amber-400 text-[10px] uppercase px-1 bg-amber-950 border border-amber-700 rounded">
                                Infraction
                              </span>
                            )}
                          </div>
                          <div className="text-xs opacity-90 font-medium">
                            {event.description || event.code} {event.points > 0 ? `(+${event.points} pts)` : ""}
                          </div>
                        </div>
                      </div>

                      <div className="text-right font-mono text-xs">
                        <span className="bg-slate-900/80 px-2 py-1 rounded text-slate-300 font-bold">
                          P{event.period} • {event.timeFormatted || `${event.seconds}s`}
                        </span>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400 shrink-0">
              <span>Takedowns: <strong className="text-white">{match.takedowns || 0}</strong></span>
              <span>Penalties: <strong className="text-amber-400">{match.penaltiesAwarded || 0}</strong></span>
              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: EDIT MATCH
    // =========================================================================
    function EditMatchModal({ match, roster, onSave, onDelete, onClose }) {
      const [formData, setFormData] = useState({ ...match });

      const handleScoreChange = (home, away) => {
        const h = parseInt(home) || 0;
        const a = parseInt(away) || 0;
        const winner = h > a ? "home" : a > h ? "away" : "tie";
        setFormData({ ...formData, homeScore: h, awayScore: a, winner });
      };

      const handleSave = (e) => {
        e.preventDefault();
        const isHomeWinner = formData.winner === "home";
        let dualPts = 0;
        if (formData.eventType === "dual" && isHomeWinner) {
          if (formData.winType === "Fall" || formData.winType === "Forfeit") dualPts = 6;
          else if (formData.winType === "Tech Fall") dualPts = 5;
          else if (formData.winType === "Major Decision") dualPts = 4;
          else dualPts = 3;
        }

        let tourneyPts = 0;
        if (formData.eventType === "tournament" && isHomeWinner) {
          tourneyPts = 2;
          if (formData.winType === "Fall") tourneyPts += 2;
          else if (formData.winType === "Tech Fall") tourneyPts += 1.5;
          else if (formData.winType === "Major Decision") tourneyPts += 1;
        }

        onSave({
          ...formData,
          dualPointsAwarded: dualPts,
          tourneyPointsAwarded: tourneyPts,
          takedowns: parseInt(formData.takedowns) || 0,
          escapes: parseInt(formData.escapes) || 0,
          reversals: parseInt(formData.reversals) || 0,
          nearfalls: parseInt(formData.nearfalls) || 0
        });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
              <h3 className="text-lg font-black uppercase text-white tracking-wide">
                Adjust Match Statistics
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-xl font-bold">
                ✕
              </button>
            </div>

            <form onSubmit={handleSave} className="space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 font-bold uppercase block mb-1">Event Type</label>
                  <select
                    value={formData.eventType}
                    onChange={(e) => setFormData({ ...formData, eventType: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold focus:outline-none"
                  >
                    <option value="dual">Dual Meet</option>
                    <option value="tournament">Tournament</option>
                    <option value="wrestleoff">Wrestle-Off</option>
                  </select>
                </div>
                <div>
                  <label className="text-slate-400 font-bold uppercase block mb-1">Event Name</label>
                  <input
                    type="text"
                    value={formData.eventName}
                    onChange={(e) => setFormData({ ...formData, eventName: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold focus:outline-none"
                  />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div className="col-span-2">
                  <label className="text-slate-400 font-bold uppercase block mb-1">Wrestler 1 (Home)</label>
                  <select
                    value={formData.homeWrestler}
                    onChange={(e) => setFormData({ ...formData, homeWrestler: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold focus:outline-none text-emerald-400"
                  >
                    {roster.map(w => (
                      <option key={w.id} value={w.name}>{w.name} ({w.weight} lbs)</option>
                    ))}
                    <option value={formData.homeWrestler}>{formData.homeWrestler}</option>
                  </select>
                </div>
                <div>
                  <label className="text-slate-400 font-bold uppercase block mb-1">Weight</label>
                  <input
                    type="text"
                    value={formData.weightClass}
                    onChange={(e) => setFormData({ ...formData, weightClass: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold text-center focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="text-slate-400 font-bold uppercase block mb-1">Wrestler 2 / Opponent</label>
                {formData.eventType === "wrestleoff" ? (
                  <select
                    value={formData.opponentName}
                    onChange={(e) => setFormData({ ...formData, opponentName: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold focus:outline-none text-rose-400"
                  >
                    {roster.map(w => (
                      <option key={w.id} value={w.name}>{w.name} ({w.weight} lbs)</option>
                    ))}
                    <option value={formData.opponentName}>{formData.opponentName}</option>
                  </select>
                ) : (
                  <input
                    type="text"
                    value={formData.opponentName}
                    onChange={(e) => setFormData({ ...formData, opponentName: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 font-bold focus:outline-none text-rose-400"
                  />
                )}
              </div>

              <div className="grid grid-cols-3 gap-3 bg-slate-800/60 p-3 rounded-xl border border-slate-800">
                <div>
                  <label className="text-emerald-400 font-bold uppercase block mb-1 text-[11px]">Home Score</label>
                  <input
                    type="number"
                    value={formData.homeScore}
                    onChange={(e) => handleScoreChange(e.target.value, formData.awayScore)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 font-mono font-black text-center text-lg"
                  />
                </div>
                <div>
                  <label className="text-rose-400 font-bold uppercase block mb-1 text-[11px]">Opp Score</label>
                  <input
                    type="number"
                    value={formData.awayScore}
                    onChange={(e) => handleScoreChange(formData.homeScore, e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 font-mono font-black text-center text-lg"
                  />
                </div>
                <div>
                  <label className="text-slate-400 font-bold uppercase block mb-1 text-[11px]">Win Type</label>
                  <select
                    value={formData.winType}
                    onChange={(e) => setFormData({ ...formData, winType: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 font-bold"
                  >
                    <option value="Fall">Fall (Pin)</option>
                    <option value="Tech Fall">Tech Fall</option>
                    <option value="Major Decision">Major Decision</option>
                    <option value="Decision">Decision</option>
                    <option value="Forfeit">Forfeit</option>
                  </select>
                </div>
              </div>

              <div className="bg-slate-800/40 p-3 rounded-xl border border-slate-800">
                <span className="font-bold text-slate-400 uppercase text-[10px] block mb-2">
                  Adjust Recorded Action Tallies:
                </span>
                <div className="grid grid-cols-4 gap-2 text-center">
                  <div>
                    <label className="text-slate-400 font-bold block mb-1">TD (+3)</label>
                    <input
                      type="number"
                      value={formData.takedowns}
                      onChange={(e) => setFormData({ ...formData, takedowns: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 font-bold font-mono text-center"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 font-bold block mb-1">Escape</label>
                    <input
                      type="number"
                      value={formData.escapes}
                      onChange={(e) => setFormData({ ...formData, escapes: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 font-bold font-mono text-center"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 font-bold block mb-1">Reversal</label>
                    <input
                      type="number"
                      value={formData.reversals}
                      onChange={(e) => setFormData({ ...formData, reversals: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 font-bold font-mono text-center"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 font-bold block mb-1">Near Falls</label>
                    <input
                      type="number"
                      value={formData.nearfalls}
                      onChange={(e) => setFormData({ ...formData, nearfalls: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 font-bold font-mono text-center"
                    />
                  </div>
                </div>
              </div>

              <div className="flex items-center justify-between pt-2">
                <button
                  type="button"
                  onClick={() => onDelete(formData.id)}
                  className="px-3 py-2 bg-rose-950 border border-rose-800 hover:bg-rose-900 text-rose-300 rounded-xl font-bold transition"
                >
                  Delete Match
                </button>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-slate-300"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-black rounded-xl font-black uppercase tracking-wider"
                  >
                    Save Changes
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }
