<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>MatTrack - Wrestling Stats & Team Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    button, input, select {
      touch-action: manipulation;
    }
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased select-none min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const playBuzzer = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {
        console.log("Audio waiting for user gesture");
      }
    };

    const DEFAULT_ROSTER = [
      { id: "w1", name: "Marcus Vance", weight: "138", grade: "Sr" },
      { id: "w2", name: "Sam Cole", weight: "144", grade: "Jr" },
      { id: "w3", name: "David Ruiz", weight: "157", grade: "So" },
      { id: "w4", name: "Tyler King", weight: "165", grade: "Sr" }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        return localStorage.getItem("mattrack_active_user") || null;
      });

      const [view, setView] = useState("scorer"); // 'scorer' | 'dual' | 'tournament' | 'wrestleoff' | 'roster' | 'profile'
      const [roster, setRoster] = useState([]);
      const [matches, setMatches] = useState([]);
      const [teamName, setTeamName] = useState("Our Wrestling Team");
      const [editingMatch, setEditingMatch] = useState(null);
      const [viewingTimelineMatch, setViewingTimelineMatch] = useState(null);
      const [editingWrestler, setEditingWrestler] = useState(null);

      useEffect(() => {
        if (currentUser) {
          const userKey = `mattrack_data_${currentUser.toLowerCase()}`;
          const savedData = localStorage.getItem(userKey);
          if (savedData) {
            try {
              const parsed = JSON.parse(savedData);
              setRoster(parsed.roster || []);
              setMatches(parsed.matches || []);
              setTeamName(parsed.teamName || "Our Wrestling Team");
            } catch (e) {
              setRoster(DEFAULT_ROSTER);
              setMatches([]);
              setTeamName("Our Wrestling Team");
            }
          } else {
            setRoster(DEFAULT_ROSTER);
            setMatches([]);
            setTeamName("Our Wrestling Team");
          }
          localStorage.setItem("mattrack_active_user", currentUser);
        } else {
          setRoster([]);
          setMatches([]);
          localStorage.removeItem("mattrack_active_user");
        }
      }, [currentUser]);

      useEffect(() => {
        if (currentUser) {
          const userKey = `mattrack_data_${currentUser.toLowerCase()}`;
          localStorage.setItem(userKey, JSON.stringify({ roster, matches, teamName }));
        }
      }, [roster, matches, teamName, currentUser]);

      const handleLogin = (username) => {
        setCurrentUser(username);
        setView("scorer");
      };

      const handleSignOut = () => {
        if (confirm("Are you sure you want to sign out?")) {
          setCurrentUser(null);
        }
      };

      const handleSaveMatch = (newMatch) => {
        setMatches([newMatch, ...matches]);
        if (newMatch.eventType === "dual") setView("dual");
        else if (newMatch.eventType === "tournament") setView("tournament");
        else setView("wrestleoff");
      };

      const handleUpdateMatch = (updatedMatch) => {
        setMatches(matches.map(m => m.id === updatedMatch.id ? updatedMatch : m));
        setEditingMatch(null);
      };

      const handleDeleteMatch = (id) => {
        if (confirm("Are you sure you want to delete this match record?")) {
          setMatches(matches.filter(m => m.id !== id));
          setEditingMatch(null);
        }
      };

      const handleRemoveWrestler = (id, name) => {
        if (confirm(`Remove ${name} from the roster? Historical records will remain intact.`)) {
          setRoster(roster.filter(w => w.id !== id));
        }
      };

      const handleSaveWrestlerEdit = (updatedWrestler, oldName) => {
        setRoster(roster.map(w => w.id === updatedWrestler.id ? updatedWrestler : w));
        if (oldName !== updatedWrestler.name) {
          setMatches(matches.map(m => {
            let mod = { ...m };
            if (mod.homeWrestler === oldName) mod.homeWrestler = updatedWrestler.name;
            if (mod.opponentName === oldName) mod.opponentName = updatedWrestler.name;
            return mod;
          }));
        }
        setEditingWrestler(null);
      };

      const handleDeleteAccount = () => {
        if (!currentUser) return;
        const confirm1 = confirm("WARNING: Are you sure you want to delete your entire profile and team account? This action cannot be undone.");
        if (!confirm1) return;
        const confirm2 = confirm("FINAL CONFIRMATION: All saved rosters, dual meets, tournaments, and scoring records will be permanently deleted.");
        if (!confirm2) return;

        const raw = localStorage.getItem("mattrack_registered_users");
        if (raw) {
          const users = JSON.parse(raw);
          delete users[currentUser.toLowerCase()];
          localStorage.setItem("mattrack_registered_users", JSON.stringify(users));
        }
        localStorage.removeItem(`mattrack_data_${currentUser.toLowerCase()}`);
        localStorage.removeItem("mattrack_active_user");
        setCurrentUser(null);
      };

      if (!currentUser) {
        return <AuthScreen onLogin={handleLogin} />;
      }

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-slate-950 text-slate-100">
          <nav className="flex items-center justify-between px-3 sm:px-6 py-2 bg-slate-900 border-b border-slate-800 shrink-0 gap-2">
            <div className="flex items-center gap-2">
              <div className="bg-amber-500 text-black p-1 rounded font-black text-sm tracking-tighter">
                MT
              </div>
              <span className="font-extrabold text-base tracking-wider text-white hidden lg:inline">
                MAT<span className="text-amber-400">TRACK</span>
              </span>
            </div>

            <div className="flex bg-slate-800/90 rounded-xl p-1 gap-1 border border-slate-700/50 overflow-x-auto">
              <button
                onClick={() => setView("scorer")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "scorer" ? "bg-amber-500 text-slate-950" : "text-slate-300 hover:text-white"
                }`}
              >
                Live Scorer
              </button>
              <button
                onClick={() => setView("dual")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "dual" ? "bg-blue-600 text-white" : "text-slate-300 hover:text-white"
                }`}
              >
                Dual Meets
              </button>
              <button
                onClick={() => setView("tournament")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "tournament" ? "bg-purple-600 text-white" : "text-slate-300 hover:text-white"
                }`}
              >
                Tournaments
              </button>
              <button
                onClick={() => setView("wrestleoff")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "wrestleoff" ? "bg-amber-600 text-white" : "text-slate-300 hover:text-white"
                }`}
              >
                Wrestle-Offs
              </button>
              <button
                onClick={() => setView("roster")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "roster" ? "bg-emerald-600 text-white" : "text-slate-300 hover:text-white"
                }`}
              >
                Roster
              </button>
              <button
                onClick={() => setView("profile")}
                className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                  view === "profile" ? "bg-indigo-600 text-white" : "text-slate-300 hover:text-white"
                }`}
              >
                Profile ⚙️
              </button>
            </div>

            <div className="flex items-center gap-2 bg-slate-800/60 border border-slate-700/60 rounded-xl px-2.5 py-1 shrink-0">
              <button
                onClick={() => setView("profile")}
                className="flex flex-col text-right hover:opacity-80 transition"
              >
                <span className="text-[9px] text-slate-400 uppercase font-bold tracking-wider leading-none">
                  Coach
                </span>
                <span className="text-xs font-black text-amber-400 leading-tight">
                  {currentUser}
                </span>
              </button>
              <button
                onClick={handleSignOut}
                title="Sign Out"
                className="ml-1 p-1 bg-slate-700 hover:bg-rose-900 text-slate-300 hover:text-white rounded text-[10px] font-bold uppercase transition"
              >
                Log Out
              </button>
            </div>
          </nav>

          <main className="flex-1 overflow-auto min-h-0">
            {view === "scorer" && (
              <LiveScorer roster={roster} onSaveMatch={handleSaveMatch} teamName={teamName} />
            )}
            {view === "dual" && (
              <MatchesTableView
                title="Dual Meets Performance"
                subtitle="Head-to-head dual matches (Fall = 6, Tech = 5, Major = 4, Dec = 3)"
                matches={matches.filter(m => m.eventType === "dual")}
                onEditMatch={setEditingMatch}
                onViewTimeline={setViewingTimelineMatch}
                type="dual"
                teamName={teamName}
              />
            )}
            {view === "tournament" && (
              <MatchesTableView
                title="Tournament Brackets & Bonus"
                subtitle="Advancements (2 pts) + Bonus (Fall: +2, Tech: +1.5, Maj: +1)"
                matches={matches.filter(m => m.eventType === "tournament")}
                onEditMatch={setEditingMatch}
                onViewTimeline={setViewingTimelineMatch}
                type="tournament"
                teamName={teamName}
              />
            )}
            {view === "wrestleoff" && (
              <MatchesTableView
                title="Intrasquad Wrestle-Offs"
                subtitle="Head-to-head challenges between teammates for varsity spots"
                matches={matches.filter(m => m.eventType === "wrestleoff")}
                onEditMatch={setEditingMatch}
                onViewTimeline={setViewingTimelineMatch}
                type="wrestleoff"
                teamName={teamName}
              />
            )}
            {view === "roster" && (
              <RosterView
                roster={roster}
                setRoster={setRoster}
                matches={matches}
                onRemoveWrestler={handleRemoveWrestler}
                onEditWrestler={setEditingWrestler}
                teamName={teamName}
                setTeamName={setTeamName}
              />
            )}
            {view === "profile" && (
              <ProfileView
                currentUser={currentUser}
                setCurrentUser={setCurrentUser}
                onDeleteAccount={handleDeleteAccount}
                teamName={teamName}
                setTeamName={setTeamName}
              />
            )}
          </main>

          {viewingTimelineMatch && (
            <ScoringTimelineModal
              match={viewingTimelineMatch}
              onClose={() => setViewingTimelineMatch(null)}
            />
          )}

          {editingMatch && (
            <EditMatchModal
              match={editingMatch}
              roster={roster}
              onSave={handleUpdateMatch}
              onDelete={handleDeleteMatch}
              onClose={() => setEditingMatch(null)}
            />
          )}

          {editingWrestler && (
            <EditWrestlerModal
              wrestler={editingWrestler}
              onSave={handleSaveWrestlerEdit}
              onClose={() => setEditingWrestler(null)}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // PROFILE MANAGEMENT VIEW (EDIT CREDENTIALS, TEAM NAME, DELETE ACCOUNT)
    // =========================================================================
    function ProfileView({ currentUser, setCurrentUser, onDeleteAccount, teamName, setTeamName }) {
      const getUsers = () => {
        const raw = localStorage.getItem("mattrack_registered_users");
        return raw ? JSON.parse(raw) : {};
      };

      const users = getUsers();
      const userKey = currentUser.toLowerCase();
      const userData = users[userKey] || { username: currentUser, email: "", password: "" };

      const [editUsername, setEditUsername] = useState(userData.username || currentUser);
      const [editEmail, setEditEmail] = useState(userData.email || "");
      const [editPassword, setEditPassword] = useState(userData.password || "");
      const [confirmPassword, setConfirmPassword] = useState(userData.password || "");
      const [editTeamName, setEditTeamName] = useState(teamName);

      const [statusMessage, setStatusMessage] = useState(null);
      const [errorMessage, setErrorMessage] = useState("");

      const handleSaveProfile = (e) => {
        e.preventDefault();
        setStatusMessage(null);
        setErrorMessage("");

        const newUsername = editUsername.trim();
        const newEmail = editEmail.trim();

        if (!newUsername || !newEmail || !editPassword) {
          setErrorMessage("All fields are required.");
          return;
        }

        if (editPassword !== confirmPassword) {
          setErrorMessage("Passwords do not match.");
          return;
        }

        const newKey = newUsername.toLowerCase();
        const currentKey = currentUser.toLowerCase();

        // Check if new username conflicts with another account
        if (newKey !== currentKey && users[newKey]) {
          setErrorMessage("That username is already taken by another account.");
          return;
        }

        // Check if email conflicts with another account
        const emailConflict = Object.entries(users).some(([k, u]) => k !== currentKey && u.email && u.email.toLowerCase() === newEmail.toLowerCase());
        if (emailConflict) {
          setErrorMessage("That email is already registered to another account.");
          return;
        }

        // If username changed, migrate match data in localStorage
        if (newKey !== currentKey) {
          const oldDataKey = `mattrack_data_${currentKey}`;
          const existingData = localStorage.getItem(oldDataKey);
          if (existingData) {
            localStorage.setItem(`mattrack_data_${newKey}`, existingData);
            localStorage.removeItem(oldDataKey);
          }
          delete users[currentKey];
        }

        users[newKey] = {
          username: newUsername,
          email: newEmail,
          password: editPassword
        };

        localStorage.setItem("mattrack_registered_users", JSON.stringify(users));
        localStorage.setItem("mattrack_active_user", newUsername);
        setCurrentUser(newUsername);
        setTeamName(editTeamName.trim() || "Our Wrestling Team");

        setStatusMessage("Profile & team preferences updated successfully!");
      };

      return (
        <div className="p-4 sm:p-6 max-w-3xl mx-auto space-y-6">
          <div>
            <h2 className="text-2xl font-black text-white uppercase tracking-tight">
              Profile & Account Settings
            </h2>
            <p className="text-xs text-slate-400 mt-0.5">
              Manage your coach login credentials, connected email, team name, and account data
            </p>
          </div>

          {statusMessage && (
            <div className="p-3 bg-emerald-950/80 border border-emerald-600/70 rounded-2xl text-xs text-emerald-200 text-center font-bold">
              {statusMessage}
            </div>
          )}

          {errorMessage && (
            <div className="p-3 bg-rose-950/80 border border-rose-700/60 rounded-2xl text-xs font-semibold text-rose-300 text-center">
              {errorMessage}
            </div>
          )}

          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
            <form onSubmit={handleSaveProfile} className="space-y-4 text-xs">
              <div className="border-b border-slate-800 pb-3">
                <span className="text-[11px] font-bold text-amber-400 uppercase tracking-wider block mb-3">
                  1. Team Configuration
                </span>
                <div>
                  <label className="block text-[11px] font-bold text-slate-300 uppercase mb-1">
                    Wrestling Team / School Name
                  </label>
                  <input
                    type="text"
                    required
                    value={editTeamName}
                    onChange={(e) => setEditTeamName(e.target.value)}
                    placeholder="e.g. Cougars Wrestling, Gilroy High"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                  />
                  <span className="text-[10px] text-slate-500 block mt-1">
                    This name will appear on your Roster table, Dual Meet boards, and live score pads.
                  </span>
                </div>
              </div>

              <div className="border-b border-slate-800 pb-3">
                <span className="text-[11px] font-bold text-amber-400 uppercase tracking-wider block mb-3">
                  2. Coach Credentials & Security
                </span>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-300 uppercase mb-1">
                      Coach / Team Username
                    </label>
                    <input
                      type="text"
                      required
                      value={editUsername}
                      onChange={(e) => setEditUsername(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-300 uppercase mb-1">
                      Connected Recovery Email
                    </label>
                    <input
                      type="email"
                      required
                      value={editEmail}
                      onChange={(e) => setEditEmail(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-300 uppercase mb-1">
                      New Password
                    </label>
                    <input
                      type="password"
                      required
                      value={editPassword}
                      onChange={(e) => setEditPassword(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-300 uppercase mb-1">
                      Confirm New Password
                    </label>
                    <input
                      type="password"
                      required
                      value={confirmPassword}
                      onChange={(e) => setConfirmPassword(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                    />
                  </div>
                </div>
              </div>

              <div className="flex justify-end pt-2">
                <button
                  type="submit"
                  className="px-6 py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-black text-xs uppercase tracking-wider rounded-xl transition active:scale-95 shadow-lg shadow-amber-500/20"
                >
                  Save Profile Changes
                </button>
              </div>
            </form>
          </div>

          {/* DANGER ZONE: DELETE ACCOUNT */}
          <div className="bg-rose-950/20 border border-rose-800/50 rounded-2xl p-5 shadow-xl">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <h3 className="text-sm font-black text-rose-400 uppercase tracking-wide">
                  Danger Zone: Delete Profile
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">
                  Permanently erase your coach profile, credentials, and all recorded wrestling stats.
                </p>
              </div>
              <button
                onClick={onDeleteAccount}
                className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-black text-xs uppercase tracking-wider rounded-xl transition shrink-0"
              >
                Delete Account Entirely
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // AUTHENTICATION SCREEN
    // =========================================================================
    function AuthScreen({ onLogin }) {
      const [mode, setMode] = useState("login");
      const [username, setUsername] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");

      const [resetLookup, setResetLookup] = useState("");
      const [matchedUserKey, setMatchedUserKey] = useState(null);
      const [generatedCode, setGeneratedCode] = useState(null);
      const [enteredCode, setEnteredCode] = useState("");
      const [newPassword, setNewPassword] = useState("");
      const [confirmNewPassword, setConfirmNewPassword] = useState("");

      const [notification, setNotification] = useState(null);
      const [error, setError] = useState("");

      const getUsers = () => {
        const raw = localStorage.getItem("mattrack_registered_users");
        return raw ? JSON.parse(raw) : {};
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setError("");
        const clean = username.trim();
        if (!clean || !password) {
          setError("Please enter both username and password.");
          return;
        }

        const users = getUsers();
        const key = clean.toLowerCase();

        let matchedUser = users[key];
        if (!matchedUser) {
          const found = Object.values(users).find(u => u.email && u.email.toLowerCase() === key);
          if (found) matchedUser = found;
        }

        if (!matchedUser || matchedUser.password !== password) {
          setError("Invalid username/email or password.");
          return;
        }
        onLogin(matchedUser.username);
      };

      const handleRegisterSubmit = (e) => {
        e.preventDefault();
        setError("");
        const cleanUser = username.trim();
        const cleanEmail = email.trim();

        if (!cleanUser || !cleanEmail || !password) {
          setError("Please fill out all fields.");
          return;
        }

        const users = getUsers();
        const key = cleanUser.toLowerCase();

        if (users[key]) {
          setError("That coach or team username is already registered.");
          return;
        }

        const emailExists = Object.values(users).some(u => u.email && u.email.toLowerCase() === cleanEmail.toLowerCase());
        if (emailExists) {
          setError("An account is already registered with that email address.");
          return;
        }

        users[key] = { username: cleanUser, email: cleanEmail, password };
        localStorage.setItem("mattrack_registered_users", JSON.stringify(users));
        onLogin(cleanUser);
      };

      const handleForgotRequestSubmit = (e) => {
        e.preventDefault();
        setError("");
        setNotification(null);
        const query = resetLookup.trim().toLowerCase();

        if (!query) {
          setError("Please enter your username or registered email.");
          return;
        }

        const users = getUsers();
        let targetKey = null;

        if (users[query]) {
          targetKey = query;
        } else {
          for (const k in users) {
            if (users[k].email && users[k].email.toLowerCase() === query) {
              targetKey = k;
              break;
            }
          }
        }

        if (!targetKey) {
          setError("No account was found matching that username or email address.");
          return;
        }

        const targetUser = users[targetKey];
        if (!targetUser.email) {
          setError("This legacy profile does not have a linked email address. Please contact your administrator.");
          return;
        }

        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedCode(code);
        setMatchedUserKey(targetKey);

        setNotification({
          type: "email_sent",
          to: targetUser.email,
          code: code
        });
        setMode("forgot_reset");
      };

      const handleResetPasswordSubmit = (e) => {
        e.preventDefault();
        setError("");

        if (enteredCode.trim() !== generatedCode) {
          setError("Invalid 6-digit verification code. Please check the code sent to your email.");
          return;
        }

        if (!newPassword || newPassword.length < 4) {
          setError("Password must be at least 4 characters long.");
          return;
        }

        if (newPassword !== confirmNewPassword) {
          setError("Passwords do not match.");
          return;
        }

        const users = getUsers();
        if (users[matchedUserKey]) {
          users[matchedUserKey].password = newPassword;
          localStorage.setItem("mattrack_registered_users", JSON.stringify(users));
          setNotification({
            type: "success",
            message: "Password updated successfully! You can now sign in with your new password."
          });
          setMode("login");
          setUsername(users[matchedUserKey].username);
          setPassword("");
          setEnteredCode("");
          setNewPassword("");
          setConfirmNewPassword("");
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4">
          <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
            <div className="text-center mb-5">
              <div className="inline-flex bg-amber-500 text-black px-3 py-1 rounded-xl font-black text-xl tracking-tighter mb-2">
                MT
              </div>
              <h1 className="text-2xl font-black text-white uppercase tracking-tight">
                Mat<span className="text-amber-400">Track</span>
              </h1>
              <p className="text-xs text-slate-400 mt-0.5">
                Wrestling Season Stats & Team Manager
              </p>
            </div>

            {notification && notification.type === "email_sent" && (
              <div className="mb-4 p-3 bg-blue-950/80 border border-blue-600/70 rounded-2xl text-xs text-blue-200">
                <div className="font-bold flex items-center gap-1 text-white">
                  <span>✉️ Email Sent</span>
                </div>
                <div className="mt-1 opacity-90">
                  Password reset code dispatched to: <strong className="text-white">{notification.to}</strong>
                </div>
                <div className="mt-2 p-2 bg-slate-900/90 rounded-lg border border-blue-500/40 text-center font-mono font-black text-base text-amber-300 tracking-widest">
                  {notification.code}
                </div>
              </div>
            )}

            {notification && notification.type === "success" && (
              <div className="mb-4 p-3 bg-emerald-950/80 border border-emerald-600/70 rounded-2xl text-xs text-emerald-200 text-center font-semibold">
                {notification.message}
              </div>

            {error && (
              <div className="mb-4 p-2.5 bg-rose-950/80 border border-rose-700/60 rounded-xl text-xs font-semibold text-rose-300 text-center">
                {error}
              </div>
            )}

            {mode === "login" && (
              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <div>
                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">
                    Coach Username or Email
                  </label>
                  <input
                    type="text"
                    required
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="e.g. CoachSmith or smith@school.org"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                  />
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-[11px] font-bold text-slate-400 uppercase">
                      Password
                    </label>
                    <button
                      type="button"
                      onClick={() => { setMode("forgot_request"); setError(""); setNotification(null); }}
                      className="text-[11px] font-bold text-amber-400 hover:underline"
                    >
                      Forgot Password?
                    </button>
                  </div>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-black text-sm uppercase tracking-wider transition active:scale-98 shadow-lg shadow-amber-500/20"
                >
                  Sign In to Team
                </button>
              </form>
            )}

            {mode === "register" && (
              <form onSubmit={handleRegisterSubmit} className="space-y-3.5">
                <div>
                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">
                    Coach / Team Username
                  </label>
                  <input
                    type="text"
                    required
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="e.g. CoachSmith"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                  />
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">
                    Connect Email Address

                  <input
                    type="email"
                    required

                    onChange={(e) => setEmail(e.target.value)}

                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                  />
                  <span className="text-[10px] text-slate-500 block mt-0.5">
                    Used for password reset & recovery.
                  </span>
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">
                    Password
                  </label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-black text-sm uppercase tracking-wider transition active:scale-98 shadow-lg shadow-amber-500/20"
                >
                  Create Team Account
                </button>
              </form>
            )}

            {mode === "forgot_request" && (
              <form onSubmit={handleForgotRequestSubmit} className="space-y-4">
                <div className="text-left">
                  <h2 className="text-sm font-black uppercase text-white tracking-wide">
                    Reset Account Password
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    Enter the coach username or the connected email address.
                  </p>
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">
                    Username or Email
                  </label>
                  <input
                    type="text"
                    required
                    value={resetLookup}
                    onChange={(e) => setResetLookup(e.target.value)}
                    placeholder="e.g. CoachSmith or email@domain.com"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-black text-sm uppercase tracking-wider transition active:scale-98 shadow-lg shadow-amber-500/20"
                >
                  Send Verification Code ✉️
                </button>

                <div className="text-center pt-2">
                  <button
                    type="button"
                    onClick={() => { setMode("login"); setError(""); setNotification(null); }}
                    className="text-xs font-bold text-slate-400 hover:text-white"
                  >
                    ← Back to Sign In
                  </button>
                </div>
              </form>
            )}

            {mode === "forgot_reset" && (
              <form onSubmit={handleResetPasswordSubmit} className="space-y-3.5">
                <div className="text-left">
                  <h2 className="text-sm font-black uppercase text-white tracking-wide">
                    Enter Verification Code
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">
                    Enter the 6-digit code sent to your linked email, then set a new password.
                  </p>
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">
                    6-Digit Verification Code
                  </label>
                  <input
                    type="text"
                    required
                    maxLength="6"
                    value={enteredCode}
                    onChange={(e) => setEnteredCode(e.target.value)}
                    placeholder="123456"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-center text-lg font-mono font-black text-amber-400 focus:outline-none focus:border-amber-400 tracking-widest"
                  />
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">
                    New Password
                  </label>
                  <input
                    type="password"
                    required
                    value={newPassword}
                    onChange={(e) => setNewPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                  />
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">
                    Confirm New Password
                  </label>
                  <input
                    type="password"
                    required
                    value={confirmNewPassword}
                    onChange={(e) => setConfirmNewPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm font-semibold text-white focus:outline-none focus:border-amber-400"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-black rounded-xl font-black text-sm uppercase tracking-wider transition active:scale-98 shadow-lg shadow-emerald-500/20"
                >
                  Save & Update Password
                </button>

                <div className="text-center pt-1">
                  <button
                    type="button"
                    onClick={() => { setMode("login"); setError(""); setNotification(null); }}
                    className="text-xs font-bold text-slate-400 hover:text-white"
                  >
                    Cancel & Return to Sign In
                  </button>
                </div>
              </form>
            )}

            {(mode === "login" || mode === "register") && (
              <div className="mt-6 pt-4 border-t border-slate-800/80 text-center text-xs">
                {mode === "register" ? (
                  <span className="text-slate-400">
                    Already have an account?{" "}
                    <button
                      onClick={() => { setMode("login"); setError(""); setNotification(null); }}
                      className="text-amber-400 font-bold hover:underline"
                    >
                      Sign In
                    </button>
                  </span>
                ) : (
                  <span className="text-slate-400">
                    Need a private team workspace?{" "}
                    <button
                      onClick={() => { setMode("register"); setError(""); setNotification(null); }}
                      className="text-amber-400 font-bold hover:underline"
                    >

      );
    }

    // =========================================================================
    // COMPONENT: LIVE SCORER (USES DYNAMIC TEAM NAME)
    // =========================================================================
    function LiveScorer({ roster, onSaveMatch, teamName }) {
      const [eventType, setEventType] = useState("dual");
      const [eventName, setEventName] = useState("Dual vs Opponent");
      const [weightClass, setWeightClass] = useState("157");
      
      const [homeWrestler, setHomeWrestler] = useState(roster[0]?.name || "Home Wrestler");
      const [awayWrestler, setAwayWrestler] = useState(roster[1]?.name || "Opponent");

      useEffect(() => {
        if (roster.length > 0 && !roster.find(w => w.name === homeWrestler)) {
          setHomeWrestler(roster[0].name);
        }
        if (eventType === "wrestleoff" && roster.length > 1 && !roster.find(w => w.name === awayWrestler)) {
          setAwayWrestler(roster[1]?.name || roster[0]?.name);
        }
      }, [roster, eventType]);

      const [periodStage, setPeriodStage] = useState(1);
      const [secondsLeft, setSecondsLeft] = useState(120);
      const [isRunning, setIsRunning] = useState(false);
      const [isEditingClock, setIsEditingClock] = useState(false);
      const [manualClockInput, setManualClockInput] = useState("");

      const [choiceModal, setChoiceModal] = useState(null);
      const [deferredToP3Chooser, setDeferredToP3Chooser] = useState(null);
      const [utbConfig, setUtbConfig] = useState(null);

      const [homeCautions, setHomeCautions] = useState(0);
      const [awayCautions, setAwayCautions] = useState(0);

      const [homeScore, setHomeScore] = useState(0);
      const [awayScore, setAwayScore] = useState(0);
      const [history, setHistory] = useState([]);
      const [isFinished, setIsFinished] = useState(false);
      const [finishType, setFinishType] = useState(null);

      const [penaltyTarget, setPenaltyTarget] = useState(null);

      useEffect(() => {
        let interval = null;
        if (isRunning && secondsLeft > 0) {
          interval = setInterval(() => setSecondsLeft(prev => prev - 1), 1000);
        } else if (secondsLeft === 0 && isRunning) {
          setIsRunning(false);
          playBuzzer();
          handleClockZero();
        }
        return () => clearInterval(interval);
      }, [isRunning, secondsLeft]);

      useEffect(() => {
        if (isFinished) return;

        if ((periodStage === 1 || periodStage === 2 || periodStage === 3) && Math.abs(homeScore - awayScore) >= 15) {
          setIsRunning(false);
          finishMatch(homeScore > awayScore ? "home" : "away", "Tech Fall");
          return;
        }

        if (periodStage === "SV-1" && homeScore !== awayScore) {
          setIsRunning(false);
          finishMatch(homeScore > awayScore ? "home" : "away", "Decision (SV-1)");
          return;
        }

        if (periodStage === "UTB" && utbConfig) {
          const bottomSide = utbConfig.topWrestlerSide === "home" ? "away" : "home";
          const lastAction = history[0];
          if (lastAction && lastAction.side === bottomSide && (lastAction.code === "E" || lastAction.code === "REV")) {
            setIsRunning(false);
            finishMatch(bottomSide, "Decision (UTB - Escape/Rev)");
            return;
          }
        }
      }, [homeScore, awayScore, history, periodStage, utbConfig]);

      const handleClockZero = () => {
        if (periodStage === 1) {
          setChoiceModal({ stage: 2, chooser: "home" });
        } else if (periodStage === 2) {
          const p3Chooser = deferredToP3Chooser || "away";
          setChoiceModal({ stage: 3, chooser: p3Chooser });
        } else if (periodStage === 3) {
          if (homeScore === awayScore) {
            setPeriodStage("SV-1");
            setSecondsLeft(60);
            logAction("SYS", "OT", 0, "Entering Sudden Victory 1 (1:00 Neutral - First score wins)");
          } else {
            const diff = Math.abs(homeScore - awayScore);
            finishMatch(homeScore > awayScore ? "home" : "away", diff >= 8 ? "Major Decision" : "Decision");
          }
        } else if (periodStage === "SV-1") {
          setChoiceModal({ stage: "TB-1", chooser: "home" });
        } else if (periodStage === "TB-1") {
          setChoiceModal({ stage: "TB-2", chooser: "away" });
        } else if (periodStage === "TB-2") {
          if (homeScore !== awayScore) {
            finishMatch(homeScore > awayScore ? "home" : "away", "Decision (TB)");
          } else {
            initiateUTB();
          }
        } else if (periodStage === "UTB") {
          if (utbConfig) {
            const topSide = utbConfig.topWrestlerSide;
            logAction("SYS", "RIDEOUT", 0, `${topSide === "home" ? homeWrestler : awayWrestler} successfully rode out the 30s!`);
            finishMatch(topSide, "Decision (UTB - Rideout)");
          }
        }
      };

      const determineFirstScorer = () => {
        const chronological = [...history].reverse();
        for (const action of chronological) {
          if (action.points > 0 && (action.side === "home" || action.side === "away")) {
            return action.side;
          }
        }
        return "home";
      };

      const initiateUTB = () => {
        const firstScorerSide = determineFirstScorer();
        setChoiceModal({ stage: "UTB", chooser: firstScorerSide });
      };

      const handleConfirmChoice = (chosenPosition, chooserSide) => {
        const stage = choiceModal.stage;
        const chooserName = chooserSide === "home" ? homeWrestler : awayWrestler;

        if (chosenPosition === "Defer") {
          setDeferredToP3Chooser(chooserSide);
          const otherSide = chooserSide === "home" ? "away" : "home";
          const otherName = otherSide === "home" ? homeWrestler : awayWrestler;
          logAction("SYS", "CHOICE", 0, `${chooserName} Deferred. ${otherName}'s choice in Period 2.`);
          setChoiceModal({ stage: 2, chooser: otherSide, isAfterDefer: true });
          return;
        }

        if (stage === "UTB") {
          const topSide = chosenPosition === "Top" ? chooserSide : (chooserSide === "home" ? "away" : "home");
          setUtbConfig({ topWrestlerSide: topSide });
          logAction("SYS", "UTB_START", 0, `Ultimate Tiebreaker (0:30): ${chooserName} chose ${chosenPosition}. Top: ${topSide === "home" ? homeWrestler : awayWrestler}`);
          setPeriodStage("UTB");
          setSecondsLeft(30);
          setChoiceModal(null);
          return;
        }

        if (stage === "TB-1") {
          logAction("SYS", "TB1_START", 0, `Tiebreaker 1 (0:30): ${chooserName} chose ${chosenPosition}`);
          setPeriodStage("TB-1");
          setSecondsLeft(30);
          setChoiceModal(null);
          return;
        }

        if (stage === "TB-2") {
          logAction("SYS", "TB2_START", 0, `Tiebreaker 2 (0:30): ${chooserName} chose ${chosenPosition}`);
          setPeriodStage("TB-2");
          setSecondsLeft(30);
          setChoiceModal(null);
          return;
        }

        logAction("SYS", "CHOICE", 0, `Period ${stage} Choice: ${chooserName} chose ${chosenPosition}`);
        setPeriodStage(stage);
        setSecondsLeft(120);
        setChoiceModal(null);
      };

      const finishMatch = (winnerSide, type) => {
        setIsRunning(false);
        setIsFinished(true);
        setFinishType(type);
      };

      const logAction = (side, code, points, description) => {
        const entry = {
          id: Math.random().toString(36).substring(2, 7),
          side,
          code,
          points,
          description: description || code,
          period: periodStage,
          seconds: secondsLeft,
          timeFormatted: formatTime(secondsLeft)
        };
        setHistory(prev => [entry, ...prev]);
      };

      const addScore = (side, code, points, description) => {
        if (isFinished) return;
        if (side === "home") setHomeScore(s => s + points);
        if (side === "away") setAwayScore(s => s + points);
        logAction(side, code, points, description);
      };

      const handleCautionPenalty = (faultSide) => {
        const isHomeFault = faultSide === "home";
        const currentCount = isHomeFault ? homeCautions : awayCautions;
        const newCount = currentCount + 1;
        const faultWrestler = isHomeFault ? homeWrestler : awayWrestler;
        const opponentSide = isHomeFault ? "away" : "home";

        if (isHomeFault) setHomeCautions(newCount);
        else setAwayCautions(newCount);

        if (newCount <= 2) {
          logAction(
            faultSide,
            "CAUTION",
            0,
            `Caution #${newCount} (False Start): ${faultWrestler} [Warning - 0 pts]`
          );
        } else {
          addScore(
            opponentSide,
            "PEN",
            1,
            `Penalty Point: Caution #${newCount} (False Start by ${faultWrestler})`
          );
        }
        setPenaltyTarget(null);
      };

      const awardStandardPenalty = (awardedToSide, penaltyName) => {
        addScore(awardedToSide, "PEN", 1, `Penalty: ${penaltyName}`);
        setPenaltyTarget(null);
      };

      const adjustClock = (deltaSeconds) => {
        setSecondsLeft(prev => Math.max(0, prev + deltaSeconds));
      };

      const handleManualClockSubmit = (e) => {
        e.preventDefault();
        const input = manualClockInput.trim();
        let total = 0;
        if (input.includes(":")) {
          const parts = input.split(":");
          const m = parseInt(parts[0], 10) || 0;
          const s = parseInt(parts[1], 10) || 0;
          total = m * 60 + s;
        } else {
          total = parseInt(input, 10) || 0;
        }
        setSecondsLeft(Math.max(0, total));
        setIsEditingClock(false);
        setManualClockInput("");
      };

      const undo = () => {
        if (history.length === 0) return;
        const [last, ...rest] = history;
        if (last.side === "home") setHomeScore(s => Math.max(0, s - last.points));
        if (last.side === "away") setAwayScore(s => Math.max(0, s - last.points));
        if (last.code === "CAUTION") {
          if (last.side === "home") setHomeCautions(c => Math.max(0, c - 1));
          if (last.side === "away") setAwayCautions(c => Math.max(0, c - 1));
        }
        setHistory(rest);
      };

      const resetMatch = () => {
        setIsRunning(false);
        setPeriodStage(1);
        setSecondsLeft(120);
        setHomeScore(0);
        setAwayScore(0);
        setHistory([]);
        setIsFinished(false);
        setFinishType(null);
        setChoiceModal(null);
        setDeferredToP3Chooser(null);
        setUtbConfig(null);
        setHomeCautions(0);
        setAwayCautions(0);
      };

      const commitResult = () => {
        const winner = homeScore > awayScore ? "home" : awayScore > homeScore ? "away" : "tie";
        const isHomeWinner = winner === "home";

        let dualPts = 0;
        if (eventType === "dual" && isHomeWinner) {
          if (finishType === "Fall" || finishType === "Forfeit") dualPts = 6;
          else if (finishType === "Tech Fall") dualPts = 5;
          else if (finishType === "Major Decision") dualPts = 4;
          else dualPts = 3;
        }

        let tourneyPts = 0;
        if (eventType === "tournament" && isHomeWinner) {
          tourneyPts = 2;
          if (finishType === "Fall") tourneyPts += 2;
          else if (finishType === "Tech Fall") tourneyPts += 1.5;
          else if (finishType === "Major Decision") tourneyPts += 1;
        }

        const statsHome = history.reduce(
          (acc, item) => {
            if (item.side === "home") {
              if (item.code === "TD") acc.td += 1;
              if (item.code === "E") acc.e += 1;
              if (item.code === "REV") acc.rev += 1;
              if (item.code.startsWith("NF")) acc.nf += 1;
              if (item.code === "PEN") acc.pen += 1;
            }
            return acc;
          },
          { td: 0, e: 0, rev: 0, nf: 0, pen: 0 }
        );

        const statsAway = history.reduce(
          (acc, item) => {
            if (item.side === "away") {
              if (item.code === "TD") acc.td += 1;
              if (item.code === "E") acc.e += 1;
              if (item.code === "REV") acc.rev += 1;
              if (item.code.startsWith("NF")) acc.nf += 1;
              if (item.code === "PEN") acc.pen += 1;
            }
            return acc;
          },
          { td: 0, e: 0, rev: 0, nf: 0, pen: 0 }
        );

        const record = {
          id: "m_" + Date.now(),
          eventType,
          eventName: eventName || (eventType === "dual" ? "Dual Meet" : eventType === "tournament" ? "Tournament" : "Varsity Wrestle-Off"),
          teamName,
          homeWrestler,
          opponentName: awayWrestler,
          weightClass,
          homeScore,
          awayScore,
          winner,
          winType: finishType || "Decision",
          dualPointsAwarded: dualPts,
          tourneyPointsAwarded: tourneyPts,
          takedowns: statsHome.td,
          escapes: statsHome.e,
          reversals: statsHome.rev,
          nearfalls: statsHome.nf,
          penaltiesAwarded: statsHome.pen,
          homeCautions,
          awayTakedowns: statsAway.td,
          awayEscapes: statsAway.e,
          awayReversals: statsAway.rev,
          awayNearfalls: statsAway.nf,
          awayPenaltiesAwarded: statsAway.pen,
          awayCautions,
          history: [...history].reverse(),
          date: new Date().toISOString().split("T")[0]
        };

        onSaveMatch(record);
        resetMatch();
      };

      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec < 10 ? "0" : ""}${sec}`;
      };

      const renderPeriodLabel = () => {
        if (periodStage === "SV-1") return "Sudden Victory (1:00)";
        if (periodStage === "TB-1") return "Tiebreaker 1 (0:30)";
        if (periodStage === "TB-2") return "Tiebreaker 2 (0:30)";
        if (periodStage === "UTB") return "Ultimate Tiebreaker (Rideout)";
        return `Period ${periodStage}`;
      };

      return (
        <div className="flex flex-col h-full bg-slate-950 p-2 sm:p-3 gap-2 select-none">
          <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-900 border border-slate-800 p-2.5 rounded-2xl shrink-0">
            <div className="flex items-center gap-2">
              <select
                value={eventType}
                onChange={(e) => {
                  setEventType(e.target.value);
                  if (e.target.value === "wrestleoff") {
                    setEventName("Varsity Wrestle-Off");
                    if (roster.length > 1) setAwayWrestler(roster[1].name);
                  }
                }}
                className={`px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider ${
                  eventType === "dual"
                    ? "bg-blue-600 text-white"
                    : eventType === "tournament"
                    ? "bg-purple-600 text-white"
                    : "bg-amber-600 text-white"
                }`}
              >
                <option value="dual">Dual Meet</option>
                <option value="tournament">Tournament</option>
                <option value="wrestleoff">Wrestle-Off</option>
              </select>

              <input
                type="text"
                value={eventName}
                onChange={(e) => setEventName(e.target.value)}
                placeholder="Opponent / Tournament"
                className="bg-slate-800 border border-slate-700 px-3 py-1 rounded-lg text-xs font-semibold focus:outline-none text-slate-200 w-36 sm:w-44"
              />

              <div className="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg">
                <span className="text-[11px] text-slate-400 font-bold">WT:</span>
                <input
                  type="text"
                  value={weightClass}
                  onChange={(e) => setWeightClass(e.target.value)}
                  className="w-9 bg-transparent text-center text-xs font-black text-white focus:outline-none"
                />
              </div>
            </div>

            {/* Interactive Clock & Adjuster Bar */}
            <div className="flex items-center gap-3 bg-slate-950/60 border border-slate-800/80 px-3 py-1.5 rounded-xl">
              <div className="flex flex-col gap-1">
                <button
                  onClick={() => adjustClock(-10)}
                  title="Minus 10s"
                  className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-[10px] font-mono font-bold rounded text-slate-300"
                >
                  -10s
                </button>
                <button
                  onClick={() => adjustClock(-1)}
                  title="Minus 1s"
                  className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-[10px] font-mono font-bold rounded text-slate-300"
                >
                  -1s
                </button>
              </div>

              <div className="text-center min-w-[130px]">
                <div className="text-[10px] uppercase tracking-widest text-amber-400 font-bold">
                  {renderPeriodLabel()}
                </div>

                {isEditingClock ? (
                  <form onSubmit={handleManualClockSubmit} className="my-0.5">
                    <input
                      type="text"
                      autoFocus
                      placeholder="e.g. 1:15"
                      value={manualClockInput}
                      onChange={(e) => setManualClockInput(e.target.value)}
                      onBlur={() => setIsEditingClock(false)}
                      className="w-24 text-center font-mono font-black text-2xl bg-slate-800 border border-amber-400 rounded text-amber-300 focus:outline-none"
                    />
                  </form>
                ) : (
                  <div
                    onClick={() => {
                      setIsRunning(false);
                      setManualClockInput(formatTime(secondsLeft));
                      setIsEditingClock(true);
                    }}
                    title="Click to manually edit clock"
                    className={`text-4xl sm:text-5xl font-mono font-black tracking-tight cursor-pointer hover:text-amber-400 transition ${
                      secondsLeft <= 10 && isRunning ? "text-red-500 animate-pulse" : "text-white"
                    }`}
                  >
                    {formatTime(secondsLeft)}
                  </div>
                )}
                <div className="text-[9px] text-slate-500 font-semibold tracking-tight">tap time to edit</div>
              </div>

              <div className="flex flex-col gap-1">
                <button
                  onClick={() => adjustClock(10)}
                  title="Plus 10s"
                  className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-[10px] font-mono font-bold rounded text-slate-300"
                >
                  +10s
                </button>
                <button
                  onClick={() => adjustClock(1)}
                  title="Plus 1s"
                  className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-[10px] font-mono font-bold rounded text-slate-300"
                >
                  +1s
                </button>
              </div>

              <div className="flex items-center gap-1.5 ml-2">
                <button
                  onClick={() => setIsRunning(!isRunning)}
                  className={`px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition ${
                    isRunning ? "bg-amber-500 text-black hover:bg-amber-400" : "bg-emerald-500 text-black hover:bg-emerald-400"
                  }`}
                >
                  {isRunning ? "Pause" : "Start"}
                </button>
                <button
                  onClick={() => {
                    setIsRunning(false);
                    setSecondsLeft(periodStage === "SV-1" ? 60 : (periodStage.toString().includes("TB") ? 30 : 120));
                  }}
                  className="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 font-bold text-xs"
                  title="Reset Round Clock"
                >
                  ↺
                </button>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={undo}
                disabled={history.length === 0}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 rounded-lg text-xs font-bold text-slate-300"
              >
                Undo
              </button>
              <button
                onClick={handleClockZero}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-300 flex items-center gap-1"
              >
                <span>End Period</span>
                <span>→</span>
              </button>
            </div>
          </div>

          {/* Scoring Pads */}
          <div className="flex-1 grid grid-cols-1 md:grid-cols-2 gap-3 min-h-0">
            {/* GREEN / HOME CORNER */}
            <div className="flex flex-col bg-emerald-950/20 border-2 border-emerald-500/30 rounded-2xl p-3 justify-between min-h-0">
              <div className="flex items-center justify-between border-b border-emerald-800/40 pb-1.5">
                <div className="flex-1 mr-2">
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-widest truncate">
                      {eventType === "wrestleoff" ? "Wrestler 1" : teamName}
                    </span>
                    <span className="text-[10px] font-mono px-1.5 py-0.2 bg-slate-800 text-slate-300 rounded">
                      Cautions: {homeCautions}
                    </span>
                  </div>
                  <select
                    value={homeWrestler}
                    onChange={(e) => setHomeWrestler(e.target.value)}
                    className="bg-transparent text-lg sm:text-xl font-black text-emerald-300 focus:outline-none w-full"
                  >
                    {roster.map(w => (
                      <option key={w.id} value={w.name} className="bg-slate-900 text-white">
                        {w.name} ({w.weight} lbs)
                      </option>
                    ))}
                    <option value="Other Wrestler" className="bg-slate-900 text-white">Other...</option>
                  </select>
                </div>
                <div className="text-6xl sm:text-7xl font-mono font-black text-emerald-400">
                  {homeScore}
                </div>
              </div>

              {/* ACTION GRID */}
              <div className="grid grid-cols-3 gap-2 my-1.5 flex-1">
                <button
                  onClick={() => addScore("home", "TD", 3, "Takedown")}
                  className="bg-emerald-600 hover:bg-emerald-500 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>TAKEDOWN</span>
                  <span>+3</span>
                </button>
                <button
                  onClick={() => addScore("home", "E", 1, "Escape")}
                  className="bg-emerald-700 hover:bg-emerald-600 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>ESCAPE</span>
                  <span>+1</span>
                </button>
                <button
                  onClick={() => addScore("home", "REV", 2, "Reversal")}
                  className="bg-emerald-700 hover:bg-emerald-600 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>REVERSAL</span>
                  <span>+2</span>
                </button>
                <button
                  onClick={() => addScore("home", "NF2", 2, "Near Fall (2)")}
                  className="bg-emerald-800 hover:bg-emerald-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+2</span>
                </button>
                <button
                  onClick={() => addScore("home", "NF3", 3, "Near Fall (3)")}
                  className="bg-emerald-800 hover:bg-emerald-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+3</span>
                </button>
                <button
                  onClick={() => addScore("home", "NF4", 4, "Near Fall (4)")}
                  className="bg-emerald-800 hover:bg-emerald-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+4</span>
                </button>
              </div>

              <div className="flex gap-2">
                <button
                  onClick={() => setPenaltyTarget("home")}
                  className="flex-1 py-2 bg-amber-500/20 border border-amber-500/60 hover:bg-amber-500 hover:text-black text-amber-300 font-bold text-xs rounded-xl uppercase transition"
                >
                  AWARD PENALTY ⚠️
                </button>
                <button
                  onClick={() => finishMatch("home", "Fall")}
                  className="flex-1 py-2 bg-emerald-500/20 border border-emerald-500 text-emerald-300 font-black text-xs rounded-xl uppercase hover:bg-emerald-500 hover:text-black transition"
                >
                  PIN / FALL ⚡
                </button>
              </div>
            </div>

            {/* RED / AWAY CORNER */}
            <div className="flex flex-col bg-rose-950/20 border-2 border-rose-500/30 rounded-2xl p-3 justify-between min-h-0">
              <div className="flex items-center justify-between border-b border-rose-800/40 pb-1.5">
                <div className="flex-1 mr-2">
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-bold text-rose-400 uppercase tracking-widest truncate">
                      Red / {eventType === "wrestleoff" ? "Wrestler 2 (Teammate)" : "Opponent"}
                    </span>
                    <span className="text-[10px] font-mono px-1.5 py-0.2 bg-slate-800 text-slate-300 rounded">
                      Cautions: {awayCautions}
                    </span>
                  </div>
                  {eventType === "wrestleoff" ? (
                    <select
                      value={awayWrestler}
                      onChange={(e) => setAwayWrestler(e.target.value)}
                      className="bg-transparent text-lg sm:text-xl font-black text-rose-300 focus:outline-none w-full"
                    >
                      {roster.map(w => (
                        <option key={w.id} value={w.name} className="bg-slate-900 text-white">
                          {w.name} ({w.weight} lbs)
                        </option>
                      ))}
                      <option value="Other Wrestler" className="bg-slate-900 text-white">Other...</option>
                    </select>
                  ) : (
                    <input
                      type="text"
                      value={awayWrestler}
                      onChange={(e) => setAwayWrestler(e.target.value)}
                      className="bg-transparent text-lg sm:text-xl font-black text-rose-300 focus:outline-none w-full uppercase"
                    />
                  )}
                </div>
                <div className="text-6xl sm:text-7xl font-mono font-black text-rose-400">
                  {awayScore}
                </div>
              </div>

              {/* ACTION GRID */}
              <div className="grid grid-cols-3 gap-2 my-1.5 flex-1">
                <button
                  onClick={() => addScore("away", "TD", 3, "Takedown")}
                  className="bg-rose-600 hover:bg-rose-500 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>TAKEDOWN</span>
                  <span>+3</span>
                </button>
                <button
                  onClick={() => addScore("away", "E", 1, "Escape")}
                  className="bg-rose-700 hover:bg-rose-600 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>ESCAPE</span>
                  <span>+1</span>
                </button>
                <button
                  onClick={() => addScore("away", "REV", 2, "Reversal")}
                  className="bg-rose-700 hover:bg-rose-600 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-xl sm:text-2xl"
                >
                  <span>REVERSAL</span>
                  <span>+2</span>
                </button>
                <button
                  onClick={() => addScore("away", "NF2", 2, "Near Fall (2)")}
                  className="bg-rose-800 hover:bg-rose-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+2</span>
                </button>
                <button
                  onClick={() => addScore("away", "NF3", 3, "Near Fall (3)")}
                  className="bg-rose-800 hover:bg-rose-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+3</span>
                </button>
                <button
                  onClick={() => addScore("away", "NF4", 4, "Near Fall (4)")}
                  className="bg-rose-800 hover:bg-rose-700 active:scale-95 rounded-xl flex flex-col items-center justify-center p-2 text-center transition font-black text-lg sm:text-xl"
                >
                  <span>NEAR FALL</span>
                  <span>+4</span>
                </button>
              </div>

              <div className="flex gap-2">
                <button
                  onClick={() => setPenaltyTarget("away")}
                  className="flex-1 py-2 bg-amber-500/20 border border-amber-500/60 hover:bg-amber-500 hover:text-black text-amber-300 font-bold text-xs rounded-xl uppercase transition"
                >
                  AWARD PENALTY ⚠️
                </button>
                <button
                  onClick={() => finishMatch("away", "Fall")}
                  className="flex-1 py-2 bg-rose-500/20 border border-rose-500 text-rose-300 font-black text-xs rounded-lg uppercase hover:bg-rose-500 hover:text-black transition"
                >
                  PIN / FALL ⚡
                </button>
              </div>
            </div>
          </div>

          {/* Action Log Bar */}
          <div className="h-9 bg-slate-900 border border-slate-800 rounded-xl flex items-center px-3 overflow-x-auto gap-2 text-xs shrink-0">
            <span className="font-bold text-slate-500 uppercase text-[10px] shrink-0">Live Log:</span>
            {history.length === 0 && <span className="text-slate-500 italic">No score actions logged yet.</span>}
            {history.map(item => (
              <span
                key={item.id}
                className={`px-2 py-0.5 rounded font-mono shrink-0 text-xs font-semibold ${
                  item.side === "SYS"
                    ? "bg-amber-950/80 text-amber-300 border border-amber-800"
                    : item.side === "home"
                    ? "bg-emerald-950 text-emerald-300 border border-emerald-800"
                    : "bg-rose-950 text-rose-300 border border-rose-800"
                }`}
              >
                {item.side === "SYS" ? "POS" : item.side === "home" ? "GRN" : "RED"} {item.points > 0 ? `+${item.points} ` : ""}({item.description || item.code}) [{item.period} @ {item.timeFormatted}]
              </span>
            ))}
          </div>

          {/* PERIOD & TIEBREAKER CHOICE MODAL */}
          {choiceModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl space-y-4">
                <div className="text-3xl mb-1">🤼‍♂️</div>
                <h3 className="text-xl font-black uppercase text-white tracking-wide">
                  {choiceModal.stage === "UTB"
                    ? "Ultimate Tiebreaker (Rideout Choice)"
                    : choiceModal.stage === "TB-1"
                    ? "Tiebreaker 1 Starting Position (0:30)"
                    : choiceModal.stage === "TB-2"
                    ? "Tiebreaker 2 Starting Position (0:30)"
                    : `Period ${choiceModal.stage} Starting Position`}
                </h3>

                <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                  <span className="text-xs text-slate-400 block mb-1 font-semibold uppercase">
                    {choiceModal.stage === "UTB"
                      ? "First Scorer with Rideout Choice:"
                      : "Wrestler with Choice:"}
                  </span>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setChoiceModal({ ...choiceModal, chooser: "home" })}
                      className={`flex-1 py-2 rounded-lg font-bold text-xs uppercase transition border ${
                        choiceModal.chooser === "home"
                          ? "bg-emerald-600 border-emerald-400 text-white"
                          : "bg-slate-800 border-slate-700 text-slate-400 hover:text-white"
                      }`}
                    >
                      {homeWrestler}
                    </button>
                    <button
                      type="button"
                      onClick={() => setChoiceModal({ ...choiceModal, chooser: "away" })}
                      className={`flex-1 py-2 rounded-lg font-bold text-xs uppercase transition border ${
                        choiceModal.chooser === "away"
                          ? "bg-rose-600 border-rose-400 text-white"
                          : "bg-slate-800 border-slate-700 text-slate-400 hover:text-white"
                      }`}
                    >
                      {awayWrestler}
                    </button>
                  </div>
                </div>

                <div className={`grid ${choiceModal.stage.toString().includes("TB") ? "grid-cols-2" : "grid-cols-2"} gap-2.5 pt-1`}>
                  <button
                    onClick={() => handleConfirmChoice("Top", choiceModal.chooser)}
                    className="p-3.5 bg-slate-800 hover:bg-emerald-600 hover:text-white rounded-xl font-black text-sm uppercase tracking-wider transition border border-slate-700"
                  >
                    TOP (Offense)
